:root{
  --font-ui:var(--font-pixel),var(--font-cjk),sans-serif;
  --font-mono:"Cascadia Code",Consolas,"JetBrains Mono",monospace;
  --font-pixel:"FusionPixel12";
--font-cjk:"Microsoft YaHei",system-ui,sans-serif;
--font-display:var(--font-ui);
  --font-dot:"DotMatrix",var(--font-pixel),"Cascadia Code",Consolas,"Segoe UI",var(--font-cjk);
  --font-mix:var(--font-pixel),var(--font-cjk);
  --row-h:23px; --cell-y:6px; --stat-y:7px;
  --radius:7px;
}
/* 按语言切换像素字体与 CJK 回退：繁体用 zh_tw 字形、日文用 ja 字形，
   保证同一语言界面内字形风格统一，不出现新旧字体混排。
   注意两点：
   ① 这些规则必须写在 :root{} **之外**，写在里面会被当作无效声明丢弃。
   ② 繁/日子集只含本语言汉字与假名（无 ASCII），故在其后追加简中子集
      （同族、含 95/95 拉丁字形）——这样拉丁字母也走实心像素字体，
      与中文观感一致，而不是回退到笔画更细的点阵字体。 */
html[lang="zh-Hant"]{ --font-pixel:"FusionPixel12TW","FusionPixel12"; --font-cjk:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif; }
html[lang="ja"]{ --font-pixel:"FusionPixel12JA","FusionPixel12"; --font-cjk:"Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; }
/* ---------- 皮肤：每套含界面色、遮罩、语法高亮色 ---------- */
:root[data-skin="plain"]{
  --bg:#ffffff; --bg-soft:#f7f8fa; --bg-sunken:#eff1f4; --bg-hover:#f2f4f7;
  --border:#e4e6eb; --border-strong:#cfd3da;
  --text:#1a1d21; --text-2:#5b6169; --text-3:#8b9198;
  --accent:#2f6fed; --accent-soft:#eaf1fe;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.08);
  --overlay:rgba(255,255,255,.74);
  --syntax-comment:#8b9198; --syntax-string:#0a8f4d; --syntax-keyword:#8b46d6; --syntax-number:#c2681a;
}

  --bg:#15121f; --bg-soft:#1b1729; --bg-sunken:#100d18; --bg-hover:#241d34;
  --border:#2d2640; --border-strong:#3f3557;
  --text:#e8e3f3; --text-2:#a79cbf; --text-3:#736a87;
  --accent:#9d7cf4; --accent-soft:#241d3d;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.4);
  --overlay:rgba(18,15,26,.78);
  --syntax-comment:#736a87; --syntax-string:#7fd6a4; --syntax-keyword:#c3a0fa; --syntax-number:#f0b070;
}

  --border:#1d2734; --border-strong:#2c3c50;
  --text:#d5e5f2; --text-2:#8ca2b8; --text-3:#5a6b7e;
  --accent:#22d3ee; --accent-soft:#0c2831;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.5);
  --overlay:rgba(8,12,18,.8);
  --syntax-comment:#5a6b7e; --syntax-string:#3ddc97; --syntax-keyword:#f472b6; --syntax-number:#fbbf24;
}
:root[data-skin="terminal"]{
  --bg:#0a0e0b; --bg-soft:#0e1410; --bg-sunken:#060906; --bg-hover:#131b15;
  --border:#1b2620; --border-strong:#293a2e;
  --text:#c6f2cd; --text-2:#7ec489; --text-3:#527d59;
  --accent:#2ed168; --accent-soft:#0d2316;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.5);
  --overlay:rgba(9,13,10,.8);
  --syntax-comment:#527d59; --syntax-string:#8de89b; --syntax-keyword:#4ade80; --syntax-number:#c9e86a;
}
:root[data-skin="paper"]{
  --bg:#faf7f1; --bg-soft:#f3eee4; --bg-sunken:#ebe5d9; --bg-hover:#efe9dd;
  --border:#e0d7c8; --border-strong:#c8bdab;
  --text:#2b2620; --text-2:#665d4f; --text-3:#948b7b;
  --accent:#b0652b; --accent-soft:#f7ede2;
  --shadow:0 1px 2px rgba(90,70,45,.07),0 6px 16px rgba(90,70,45,.09);
  --overlay:rgba(250,247,241,.78);
  --syntax-comment:#948b7b; --syntax-string:#4a7c3f; --syntax-keyword:#9b4d8a; --syntax-number:#b06a2b;
}
:root[data-skin="dusk"]{
  --bg:#191411; --bg-soft:#211a15; --bg-sunken:#120e0b; --bg-hover:#2a211a;
  --border:#372c23; --border-strong:#4e3f32;
  --text:#f0e6db; --text-2:#b7a593; --text-3:#82715f;
  --accent:#f08a4a; --accent-soft:#2d1f13;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.4);
  --overlay:rgba(17,13,10,.8);
  --syntax-comment:#82715f; --syntax-string:#8fce8a; --syntax-keyword:#e9a06a; --syntax-number:#f0c060;
}
:root[data-skin="nothing"]{
  --bg:#ffffff; --bg-soft:#f5f5f5; --bg-sunken:#ececec; --bg-hover:#f0f0f0;
  --border:#e4e4e4; --border-strong:#d0d0d0;
  --text:#111111; --text-2:#555555; --text-3:#8a8a8a;
  --accent:#e63225; --accent-soft:#fdeeec;
  --shadow:0 0 0 1px rgba(0,0,0,.04);
  --overlay:rgba(255,255,255,.82);
  --syntax-comment:#8a8a8a; --syntax-string:#555555; --syntax-keyword:#111111; --syntax-number:#777777;
}
/* ---------- 间距 ---------- */
/* 间距固定为「舒适」档（原「密度」设置已移除） */
:root{ --row-h:26px; --cell-y:8px; --stat-y:9px; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:flex;flex-direction:column;overflow:hidden;
  font-size:12px;line-height:1.5;font-family:var(--font-ui);
  color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}

/* ---------- 顶栏（菜单栏 = 自定义标题栏） ---------- */
.menubar{
  height:38px;flex:none;display:flex;align-items:center;gap:8px;
  padding:0 0 0 10px;border-bottom:1px solid var(--border);background:var(--bg-soft);
  position:relative;z-index:30;
  app-region:drag;-webkit-app-region:drag;
}
/* 可点元素退出拖动区，空白处（spacer/间隙/内边距）拖动窗口 */
.menubar .brand,.menubar .menus,.menubar .search,.menubar .win-controls,.menubar #skinPanel,.menubar #langPanel{
  app-region:no-drag;-webkit-app-region:no-drag;
}
/* 窗口控制按钮（仅 exe 宿主显示） */
.win-controls{display:none;flex:none;height:100%;margin-left:6px}
html.wv .win-controls{display:flex}
.wc-btn{width:45px;height:100%;display:flex;align-items:center;justify-content:center;
  padding:0;border-radius:0;color:var(--text-2)}
.wc-btn:hover{background:var(--bg-hover);color:var(--text)}
.wc-btn.close:hover{background:#e81123;color:#fff}
.wc-btn svg{width:10px;height:10px;display:block}
#icoRestore{display:none}
html.wvmax #icoMax{display:none}
html.wvmax #icoRestore{display:block}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-dot);font-weight:400;font-size:14px;letter-spacing:.5px}
.brand .logo{width:18px;height:18px;flex:none;display:block;border-radius:4.5px;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .18s}.brand:hover .logo{transform:rotate(-4deg) scale(1.06)}
.brand small{font-weight:400;color:var(--text-3);font-size:11.5px}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;
  border:1px solid var(--border-strong);border-radius:7px;background:var(--bg);
  font-size:12px;white-space:nowrap;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--bg-hover);border-color:var(--text-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{background:var(--bg-hover);border-color:var(--border)}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:7px;overflow:hidden}
.seg button{padding:0 10px;height:28px;font-size:12px;color:var(--text-2);border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:400}
.search{position:relative}
.search input{
  height:30px;width:186px;padding:0 26px 0 28px;border:1px solid var(--border-strong);
  border-radius:7px;background:var(--bg-soft);outline:none;font-size:12px;
}
.search input:focus{border-color:var(--accent);background:var(--bg)}
.search .ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:12px}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--text-3);padding:2px 4px;display:none}
.search .clr:hover{color:var(--text)}
/* 兜底：万一日后把 input 改回 type=search，也压掉浏览器自带的清除按钮，
   避免与应用自己的「✕」并排出现两个叉。 */
.search input::-webkit-search-cancel-button,
.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}

/* ---------- 菜单栏下拉 ---------- */
.menubar .brand{margin-right:4px}
.menus{display:flex;align-items:stretch;height:100%}
.menu{position:relative;display:flex;align-items:stretch}
.menu>.ml{display:flex;align-items:center;height:26px;margin:auto 0;padding:0 11px;
  border-radius:6px;font-size:12px;color:var(--text-2);background:none}
.menu>.ml:hover{background:var(--bg-hover);color:var(--text)}
.menu.open>.ml{background:var(--bg-hover);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.drop{position:absolute;top:34px;left:0;min-width:196px;z-index:60;display:none;
  background:var(--bg);border:1px solid var(--border-strong);border-radius:10px;
  box-shadow:var(--shadow);padding:6px;animation:dropIn .12s ease}
.menu.open>.drop{display:block}
@keyframes dropIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:6px;
  font-size:12px;color:var(--text);text-align:left;background:none}
.mi:hover{background:var(--bg-hover)}
.mi .tick{width:14px;flex:none;text-align:center;color:var(--accent);font-size:12px}
.mi .tick.sp{visibility:hidden}
.mi .short{margin-left:auto;color:var(--text-3);font-size:11px;font-family:var(--font-mono)}
.menu .sep{height:1px;background:var(--border);margin:5px 4px}

/* ---------- 状态栏 ---------- */
.statusbar{height:25px;flex:none;display:flex;align-items:center;font-family:var(--font-mix);
  background:var(--accent);color:#fff;font-size:12px;z-index:30;
  padding:0 2px;overflow:hidden;user-select:none;text-shadow:0 1px 1px rgba(0,0,0,.18)}
.statusbar .sb{display:flex;align-items:center;gap:5px;height:100%;padding:0 11px;white-space:nowrap}
.statusbar .sb.click{cursor:pointer}
.statusbar .sb.click:hover{background:rgba(255,255,255,.18)}
.statusbar .sb b{font-weight:400}
.statusbar .sb span{opacity:.82}
.statusbar .sb.spacer{flex:1;padding:0;cursor:default}
.statusbar .sb.spacer:hover{background:none}
body.no-left #left{display:none}
body.no-right #right{display:none}
:root[data-skin="nothing"] .statusbar{background:var(--bg-soft);color:var(--text);text-shadow:none;border-top:1px solid var(--border)}
:root[data-skin="nothing"] .statusbar .sb.click:hover{background:var(--bg-hover)}
:root[data-skin="nothing"] .statusbar .sb span{color:var(--text-2)}
:root[data-skin="nothing"] .statusbar .sb b{color:var(--text)}
/* 红色只用于选项类控件（按钮/描边/选中底色），一切文字与符号保持黑色 */
:root[data-skin="nothing"] .node.on{color:var(--text)}
:root[data-skin="nothing"] .node.on .vv{color:var(--text-2)}
:root[data-skin="nothing"] .seg button.on{color:var(--text)}
:root[data-skin="nothing"] .mini button.on{color:var(--text)}
:root[data-skin="nothing"] .skin-card.on .nm{color:var(--text)}
:root[data-skin="nothing"] .mi .tick{color:var(--text)}

/* ---------- 通用对话框 ---------- */
/* 顶栏（menubar）高 38px，且窗口是无边框的：预览层与弹窗都必须从它下方开始，
   否则会把品牌区、菜单、搜索框与右上角的最小化/最大化/关闭一并盖住。
   注意 #viewer / .modal 的 inset 值必须与 .menubar 的 height 保持一致。 */
.modal{position:fixed;inset:38px 0 0 0;z-index:80;display:none;align-items:center;justify-content:center;
  background:var(--overlay);backdrop-filter:blur(2px)}
.modal.on{display:flex}
.modal .box{width:min(560px,88vw);background:var(--bg);border:1px solid var(--border-strong);
  border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;animation:dropIn .14s ease}
.modal .box h3{margin:0 0 10px;font-size:15px}
.modal .box p{margin:0 0 8px;font-size:12px;color:var(--text-2);line-height:1.6}
.modal .box .keys{width:100%;border-collapse:collapse;font-size:13px}
.modal .box .keys td{padding:5px 4px;border-bottom:1px solid var(--border)}
.modal .box .keys td:first-child{font-family:var(--font-mono);color:var(--accent);white-space:nowrap;width:96px}
.modal .box .acts{display:flex;justify-content:flex-end;margin-top:14px}
.modal .box .acts button{height:30px;padding:0 14px;border-radius:7px;border:1px solid var(--border-strong);
  background:var(--bg);font-size:12px;cursor:pointer}
.modal .box .acts button.primary{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- 语言 / 字体 / 语言包 ---------- */
.sp-title{font-size:10.5px;color:var(--text-3);letter-spacing:.06em;margin:12px 0 6px;text-transform:uppercase}
#skinPanel .sp-title:first-child{margin-top:0}
.lang-list{display:flex;flex-direction:column;gap:4px}
.lang-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;
  border:1px solid transparent;font-size:12.5px;color:var(--text-2)}
.lang-item:hover{background:var(--bg-hover)}
.lang-item.on{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.lang-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-item .tag{font-size:10px;color:var(--text-3);border:1px solid var(--border-strong);border-radius:4px;padding:0 4px}
.lang-item.on .tag{color:var(--text-2);border-color:var(--accent)}
.sp-btns{display:flex;gap:6px;margin-top:8px}
.sp-btns .btn{height:26px;padding:0 10px;font-size:11.5px}
.font-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.font-row .lab{width:74px;flex:none;font-size:11.5px;color:var(--text-2)}
.font-row select{flex:1;min-width:0;height:26px;padding:0 6px;font-size:11.5px;color:var(--text);
  background:var(--bg);border:1px solid var(--border-strong);border-radius:6px}
.font-row input{flex:1;min-width:0;height:26px;padding:0 8px;font-size:11.5px;color:var(--text);
  background:var(--bg);border:1px solid var(--border-strong);border-radius:6px}
.font-preview{margin-top:8px;padding:8px 10px;border:1px dashed var(--border-strong);border-radius:7px;
  font-size:12px;color:var(--text-2);line-height:1.7}
.font-preview b{color:var(--text);font-weight:400}
.pack-list{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px;max-height:220px;overflow:auto}
.pack-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--border);
  border-radius:7px;font-size:12px;color:var(--text-2);background:var(--bg)}
.pack-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pack-item .tag{font-size:10px;color:var(--text-3)}
.modal .box.wide{max-width:520px}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.mrow .lab{width:68px;flex:none;font-size:11.5px;color:var(--text-2)}
.mrow input,.mrow select{flex:1;min-width:0;height:28px;padding:0 8px;font-size:12px;color:var(--text);
  background:var(--bg);border:1px solid var(--border-strong);border-radius:6px}
.lang-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 14px}
.lang-card{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--border-strong);
  border-radius:9px;cursor:pointer;background:var(--bg);transition:background .12s,border-color .12s}
.lang-card:hover{background:var(--bg-hover)}
.lang-card.on{border-color:var(--accent);background:var(--accent-soft)}
.lang-card .code{font-size:10.5px;color:var(--text-3);font-family:var(--font-mono)}
.lang-card .nm{font-size:13.5px;color:var(--text)}
.hintline{font-size:11.5px;color:var(--text-3);line-height:1.7;margin-top:10px}
.modal .box .acts.split{justify-content:space-between}
.modal .box .acts.split .r{display:flex;gap:8px}
.pv-doc{padding:12px 14px;font-size:12.5px;line-height:1.75;color:var(--text)}
.pv-doc .pv-h{margin:14px 0 6px;font-size:11.5px;letter-spacing:.08em;color:var(--text-3);
  text-transform:uppercase}
.pv-doc .pv-h:first-child{margin-top:0}
.pv-doc .pv-p{margin:0 0 7px;white-space:pre-wrap}
.pv-doc .pv-tbl{margin:8px 0 14px;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.pv-doc .pv-tbl td{padding:5px 9px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);
  font-size:12px;vertical-align:top}
.pv-doc .pv-tbl tr:last-child td{border-bottom:none}
.pv-doc .pv-tbl td:last-child{border-right:none}
/* ---------- 偏好面板 ---------- */
.modal .box.prefbox{max-width:620px;width:min(620px,92vw);max-height:86vh;display:flex;flex-direction:column}
.pref-body{overflow:auto;padding-right:2px;margin:4px 0 2px}
.pref-row{padding:11px 0;border-bottom:1px solid var(--border)}
.pref-row:last-child{border-bottom:none}
.pref-row .t{font-size:12.5px;color:var(--text);margin-bottom:3px}
.pref-row .d{font-size:11px;color:var(--text-3);line-height:1.6;margin-bottom:7px}
.pref-row .seg button{padding:4px 10px;font-size:11.5px}
.pref-row textarea{width:100%;min-height:64px;padding:7px 9px;font-size:11.5px;line-height:1.7;
  color:var(--text);background:var(--bg-soft);border:1px solid var(--border-strong);
  border-radius:7px;font-family:var(--font-mono);resize:vertical}
/* ---------- 主区 ---------- */
main{flex:1;display:flex;min-height:0;overflow:hidden}
aside{width:268px;flex:none;background:var(--bg-soft);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
aside.right{border-right:none;border-left:1px solid var(--border);width:min(420px,36vw);position:relative}
aside.collapsed{display:none}
.rz{position:absolute;left:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:6}
.rz.rz-left{left:auto;right:-3px}
.rz:hover,.rz.on{background:var(--accent);opacity:.35}
aside.collapsed .rz{display:none}
/* 面板收起后，主画布边缘的展开按钮。
   注意：它必须与面板头里的收起按钮**同高同尺寸**——两者是同一个交互的两态，
   切换时若位置或大小有差，视觉上就成了「按钮跳走了」。
   故锚定到 .stage（而非画布内部），top:5px 使其垂直中心正好落在
   pane-head 的 34px 行带中心（38+5+12 = 55 = 38+34/2）。 */
.edge-btn{position:absolute;top:5px;z-index:6;display:none;
  align-items:center;justify-content:center}
#btnShowLeft{left:8px}
#btnShowRight{right:8px}
body.no-left #btnShowLeft{display:flex}
body.no-right #btnShowRight{display:flex}
/* 面板收起时，给面包屑让出按钮占用的宽度，避免文字被按钮压住 */
body.no-left  .crumbs{padding-left:46px}
body.no-right .crumbs{padding-right:46px}
/* 四枚面板收起/展开按钮共用一套规格：同尺寸、同圆角、同描边、同色。
   任何一处单独特殊化都会破坏「按下前后是同一个按钮」的观感。 */
#btnHideLeft,#btnPanels,#btnShowLeft,#btnShowRight{
  width:24px;height:24px;padding:0;flex:none;gap:0;justify-content:center;
  border:1px solid var(--border-strong);border-radius:6px;
  background:var(--bg);color:var(--text-2);
  font-size:12px;line-height:1;white-space:nowrap;box-shadow:var(--shadow);
  transition:background .12s,border-color .12s;
}
#btnHideLeft:hover,#btnPanels:hover,#btnShowLeft:hover,#btnShowRight:hover{
  background:var(--bg-hover);color:var(--text);border-color:var(--text-3);
}
.pane-head{
  flex:none;height:34px;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;
  font-size:11px;font-weight:400;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;
}
/* 右栏头部左右内边距对调：其"内侧"是左沿，这样收起按钮距画布的间隙
   才与左栏一致（10px + 1px 边框），标题也对称地贴住窗口外缘。 */
aside.right .pane-head{padding:0 12px 0 10px}
.stats{flex:none;padding:10px 12px 12px;border-bottom:1px solid var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:var(--stat-y) 9px}
.stat .k{font-size:10.5px;color:var(--text-3);margin-bottom:2px}
.stat .v{font-size:16px;white-space:nowrap;font-weight:400;font-variant-numeric:tabular-nums;font-family:var(--font-dot);letter-spacing:.5px}
.langbars{margin-top:11px;display:flex;flex-direction:column;gap:5px}
.lb{display:flex;align-items:center;gap:7px;font-size:11.5px}
.lb .sw{width:9px;height:9px;border-radius:2px;flex:none}
.lb .nm{flex:1;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .pc{color:var(--text-3);font-variant-numeric:tabular-nums;font-family:var(--font-dot);font-size:11px;width:32px;text-align:right}
.lb .bar{width:50px;height:5px;border-radius:3px;background:var(--bg-sunken);overflow:hidden;flex:none}
.lb .bar i{display:block;height:100%;border-radius:3px}
.tree{flex:1;overflow:auto;padding:4px 6px 20px;min-height:0}
.tree::-webkit-scrollbar,.scroll::-webkit-scrollbar,.tbl::-webkit-scrollbar,.insp::-webkit-scrollbar,pre.code::-webkit-scrollbar{width:10px;height:10px}
.tree::-webkit-scrollbar-thumb,.tbl::-webkit-scrollbar-thumb,.insp::-webkit-scrollbar-thumb,pre.code::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:3px solid var(--bg-soft)}
.node{display:flex;align-items:center;gap:5px;height:var(--row-h);padding:0 6px;border-radius:5px;
  font-size:12px;cursor:default;white-space:nowrap;color:var(--text-2)}
.node:hover{background:var(--bg-hover)}
.node.on{background:var(--accent-soft);color:var(--accent);font-weight:400}
.node .tw{width:13px;flex:none;text-align:center;color:var(--text-3);font-size:9px;transition:transform .12s}
.node .tw.open{transform:rotate(90deg)}
.node .ib{width:13px;flex:none;text-align:center;font-size:10px;opacity:.75}
.node .lb2{flex:1;overflow:hidden;text-overflow:ellipsis}
.node .vv{color:var(--text-3);font-size:10.5px;font-variant-numeric:tabular-nums;font-family:var(--font-dot);flex:none}
.node.on .vv{color:var(--accent);opacity:.85}

/* ---------- 舞台 ---------- */
.stage{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);position:relative}
.crumbs{flex:none;height:36px;display:flex;align-items:center;gap:2px;padding:0 14px;font-family:var(--font-mix);
  border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;font-size:12.5px}
.crumbs::-webkit-scrollbar{height:0}
.crumb{color:var(--text-2);padding:3px 6px;border-radius:5px;cursor:pointer}
.crumb:hover{background:var(--bg-hover);color:var(--text)}
.crumb.last{color:var(--text);font-weight:400}
.crumb-sep{color:var(--text-3);font-size:10px}
.canvas-wrap{flex:1;position:relative;min-height:0;overflow:hidden}
svg.map{display:block;width:100%;height:100%}
svg.map rect.blk{cursor:pointer;transition:opacity .1s}
svg.map rect.blk:hover{opacity:.72}
/* 选中框：不能只用主题红描边 —— 地图里本身就有红色语言块，两者会同色混淆。
   改为「白色内框 + 深色外框」的双线几何框，与任何色块都能区分，也更贴近
   Nothing 的直角几何语汇。 */
svg.map rect.sel{stroke:var(--accent);stroke-width:3;paint-order:stroke;
  filter:drop-shadow(0 0 0.5px #111) drop-shadow(0 0 0.5px #111)}
svg.map text{pointer-events:none;user-select:none}
/* 全局禁用文本选择：双击打开时名字不会再被浏览器的「双击选词」选中变蓝。
   按用户要求不保留任何例外 —— 键盘输入不受影响，只是不能用鼠标划选文字。 */
*{user-select:none}

/* ---------- 右键菜单 ---------- */
#ctxMenu{position:fixed;z-index:90;min-width:176px;padding:4px;display:none;
  background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;
  box-shadow:0 8px 26px rgba(0,0,0,.2);font-size:12.5px}
#ctxMenu.on{display:block}
#ctxMenu .it{padding:6px 10px;border-radius:5px;cursor:pointer;color:var(--text-2)}
#ctxMenu .it:hover{background:var(--bg-hover);color:var(--text)}
#ctxMenu .sp{height:1px;margin:4px 6px;background:var(--border)}

/* 强调色行：占满卡片宽度、内容居中均匀分布 */
.acc-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  justify-content:center;width:100%;padding:2px 0}
/* 「跟随皮肤」：彩虹色 */
.acc.acc-auto{background:conic-gradient(from 0deg,hsl(0,86%,57%),hsl(15,86%,57%),hsl(30,86%,57%),hsl(45,86%,57%),hsl(60,86%,57%),hsl(75,86%,57%),hsl(90,86%,57%),hsl(105,86%,57%),hsl(120,86%,57%),hsl(135,86%,57%),hsl(150,86%,57%),hsl(165,86%,57%),hsl(180,86%,57%),hsl(195,86%,57%),hsl(210,86%,57%),hsl(225,86%,57%),hsl(240,86%,57%),hsl(255,86%,57%),hsl(270,86%,57%),hsl(285,86%,57%),hsl(300,86%,57%),hsl(315,86%,57%),hsl(330,86%,57%),hsl(345,86%,57%),hsl(360,86%,57%));background-clip:padding-box}
.tbl{height:100%;overflow:auto;display:none}

/* ---------- 空态 ---------- */
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--text-2);text-align:center;padding:24px}
.empty .art{width:110px;height:110px}
.empty h2{margin:2px 0 0;font-size:15px;font-weight:400;color:var(--text)}
.empty p{margin:0;font-size:12px;max-width:410px;line-height:1.7}
.empty .hint{font-size:11.5px;color:var(--text-3)}
.drop-hi{outline:2px dashed var(--accent);outline-offset:-10px;background:var(--accent-soft)}

/* ---------- 列表 ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl td.pth{color:var(--text-3);font-size:11.5px;max-width:340px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cap-note{padding:10px 14px;color:var(--text-3);font-size:11.5px;border-top:1px solid var(--border)}
thead th{position:sticky;top:0;background:var(--bg-soft);border-bottom:1px solid var(--border);
  text-align:left;font-weight:400;font-size:11px;color:var(--text-3);letter-spacing:.04em;
  padding:7px 12px;cursor:pointer;white-space:nowrap;z-index:2}
thead th:hover{color:var(--text)}
tbody tr{border-bottom:1px solid var(--border);cursor:default}
tbody tr:hover{background:var(--bg-hover)}
tbody tr.on{background:var(--accent-soft)}
tbody td{padding:var(--cell-y) 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-2)}
.nmcell{display:flex;align-items:center;gap:7px;min-width:0}
.nmcell .sw{width:8px;height:8px;border-radius:2px;flex:none}
.nmcell .tx{overflow:hidden;text-overflow:ellipsis}

/* ---------- 检查器 ---------- */
.insp{flex:1;overflow:auto;padding:12px 14px 24px;min-height:0}
.insp h3{margin:0 0 3px;font-size:13.5px;font-weight:400;word-break:break-all;line-height:1.4}
.insp .path{font-size:11.5px;color:var(--text-3);word-break:break-all;margin-bottom:12px;
  font-family:var(--font-mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px;margin-bottom:12px}
.kv .k{color:var(--text-3)}
.kv .v{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-dot);word-break:break-all}
.sect{margin-top:15px}
.sect-t{font-size:11px;font-weight:400;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:7px;display:flex;align-items:center;gap:8px}
.rank{display:flex;flex-direction:column;gap:2px}
.rank .r{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 7px;border-radius:6px}
.rank .r[data-path]{cursor:pointer}
.rank .r[data-path]:hover{background:var(--bg-hover)}
.rank .r .i{width:15px;color:var(--text-3);font-size:10.5px;font-variant-numeric:tabular-nums;flex:none}
.rank .r .sw2{width:8px;height:8px;border-radius:2px;flex:none}
.rank .r .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.rank .r .v{color:var(--text-3);font-size:11px;font-variant-numeric:tabular-nums;font-family:var(--font-dot);flex:none}
.meter{height:5px;border-radius:3px;background:var(--bg-sunken);overflow:hidden;display:flex;margin:5px 0 4px}
.meter i{height:100%}
.legend-inline{display:flex;gap:12px;font-size:11px;color:var(--text-3)}
.legend-inline b{font-weight:400;color:var(--text-2)}
pre.code{margin:0;background:var(--bg-sunken);border:1px solid var(--border);border-radius:8px;
  padding:6px 0;overflow:auto;font-family:var(--font-mono);
  font-size:11.5px;line-height:1.62}
pre.code .ln{display:block;white-space:pre;padding-right:12px}
pre.code .ln:hover{background:var(--bg-hover)}
pre.code .g{display:inline-block;width:34px;text-align:right;padding-right:12px;color:var(--text-3);
  user-select:none;position:sticky;left:0}
.tk-c{color:var(--syntax-comment);font-style:italic}
.tk-s{color:var(--syntax-string)}
.tk-k{color:var(--syntax-keyword);font-weight:400}
.tk-n{color:var(--syntax-number)}

/* ---------- 浮层 ---------- */
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--text);color:var(--bg);
  padding:7px 10px;border-radius:7px;font-size:11.5px;line-height:1.55;max-width:300px;
  box-shadow:var(--shadow);opacity:0;transition:opacity .09s}
#tip.on{opacity:1}
#tip .t{font-weight:400;word-break:break-all;margin-bottom:2px}
#tip .m{opacity:.82;font-variant-numeric:tabular-nums}
#scan{position:fixed;inset:38px 0 0 0;z-index:60;display:none;align-items:center;justify-content:center;
  background:var(--overlay);backdrop-filter:blur(2px)}
#scan.on{display:flex}
.scanbox{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:18px 22px;
  box-shadow:var(--shadow);width:330px;text-align:center}
.scanbox .t{font-size:12px;font-weight:400;margin-bottom:10px}
.scanbox .p{height:5px;border-radius:3px;background:var(--bg-sunken);overflow:hidden;margin-bottom:9px}
.scanbox .p i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s}
.scanbox .s{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);z-index:90;
  background:var(--text);color:var(--bg);padding:9px 15px;border-radius:8px;font-size:12px;
  box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none;max-width:70vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 外观面板 ---------- */
#skinPanel{
  position:absolute;top:36px;right:14px;z-index:65;width:390px;display:none;
  background:var(--bg);border:1px solid var(--border-strong);border-radius:12px;
  box-shadow:var(--shadow);padding:14px;
}
#skinPanel.on{display:block}
/* 语言与字体面板：与外观面板同款外观，独立入口（菜单栏「语言」） */
#langPanel{
  position:absolute;top:36px;right:14px;z-index:65;width:390px;display:none;
  background:var(--bg);border:1px solid var(--border-strong);border-radius:12px;
  box-shadow:var(--shadow);padding:14px;max-height:calc(100vh - 76px);overflow:auto;
}
#langPanel.on{display:block}
#langPanel .sp-title:first-child{margin-top:0}
.sp-title{font-family:var(--font-display);font-size:10.5px;font-weight:400;color:var(--text-3);
  letter-spacing:.07em;text-transform:uppercase;margin:0 0 8px}
.skin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.skin-card{border:1px solid var(--border);border-radius:8px;padding:7px;cursor:pointer;
  background:var(--bg-soft);transition:border-color .12s}
.skin-card:hover{border-color:var(--text-3)}
.skin-card.on{border-color:var(--accent)}
.skin-card .bars{display:flex;gap:2px;margin-bottom:6px}
.skin-card .bars i{height:15px;border-radius:2px;flex:1}
.skin-card .nm{font-size:11px;color:var(--text-2);text-align:center}
.skin-card.on .nm{color:var(--accent);font-weight:400}
.sp-row{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.sp-row > .lab{font-size:12px;color:var(--text-2);width:52px;flex:none}
.acc{width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent;background-clip:padding-box;flex:none;
  transition:transform .1s}
.acc:hover{transform:scale(1.14)}
.acc.on{border-color:var(--text)}
.mini{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden}
.mini button{padding:0 6px;height:26px;font-size:12px;color:var(--text-2);white-space:nowrap;
  border-right:1px solid var(--border)}
.mini button:last-child{border-right:none}
.mini button.on{background:var(--accent-soft);color:var(--accent);font-weight:400}
svg.map text{font-family:var(--font-mix)}

/* ---------- 全屏预览 ---------- */
#viewer{position:fixed;inset:38px 0 0 0;z-index:70;background:var(--bg);display:none;flex-direction:column}
#viewer.on{display:flex}
.vw-head{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-bottom:1px solid var(--border);background:var(--bg-soft)}
.vw-title{font-size:13.5px;font-weight:400;font-family:var(--font-display);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:36%}
.vw-meta{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums;font-family:var(--font-mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw-chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2);
  cursor:pointer;white-space:nowrap;user-select:none}
.vw-body{flex:1;overflow:auto;min-height:0}
.vw-body[data-mode="media"]{display:flex;align-items:center;justify-content:center;
  padding:22px;background:var(--bg-sunken)}
.vw-body[data-mode="media"] img{max-width:100%;max-height:100%;object-fit:contain;
  border-radius:6px;box-shadow:var(--shadow)}
.vw-body[data-mode="media"] video{max-width:100%;max-height:100%;border-radius:6px}
.vw-body[data-mode="media"] audio{width:min(560px,90%)}
.vw-body[data-mode="media"] iframe{width:100%;height:100%;border:none;border-radius:6px;background:#fff}
.vw-body[data-mode="text"] pre.code{border:none;border-radius:0;background:var(--bg);padding:10px 0;min-height:100%}
.vw-body[data-mode="note"]{display:flex;align-items:center;justify-content:center;padding:30px;background:var(--bg-sunken)}
#viewer.wrap .vw-body[data-mode="text"] pre.code .ln{white-space:pre-wrap;overflow-wrap:anywhere}
.pv-note{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:22px 26px;
  max-width:440px;text-align:center;box-shadow:var(--shadow)}
.pv-note h4{margin:0 0 8px;font-size:14px;font-weight:400;font-family:var(--font-display)}
.pv-note p{margin:0 0 5px;font-size:12px;color:var(--text-2);line-height:1.7}
.pv-note .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);
  font-size:11px;padding:2px 9px;border-radius:20px;margin-bottom:10px}
.pv-tbl{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--font-mono)}
.pv-tbl th,.pv-tbl td{border:1px solid var(--border);padding:4px 8px;text-align:left;
  white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.pv-tbl thead th{position:sticky;top:0;background:var(--bg-soft);font-weight:400;z-index:1}
.pv-tbl tbody tr:nth-child(even){background:var(--bg-soft)}
.pv-bar{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--border);
  background:var(--bg-soft);font-size:11.5px;color:var(--text-2)}
.pv-bar .spacer{flex:1}
.pv-mono{margin:0;padding:10px 14px;font-family:var(--font-mono);font-size:11.5px;line-height:1.65;
  color:var(--text-2);white-space:pre}
</style>
</head>

  <nav class="menus" id="menus">

      <div class="drop">
        <button class="mi" data-act="open"><span class="tick sp">·</span>打开文件夹<span class="short">Ctrl+O</span></button>

<script>
"use strict";

/* ---------------- 多语言内核 ---------------- */
/* 词典以**简体原文**为键：简体模式零词典、天然回退；语言包作者只需
   提供 { "中文原文": "译文" } 即可，门槛最低。 */

/* ---------- 语言包（可安装插件） ---------- */
const PACK_KEY = 'codemap.packs';
var PACKS = Object.create(null);   /* 无原型：杜绝 __proto__ 之类键污染或串味 */
let LANG_ID = 'zh-CN';   /* 当前语言：tr 的唯一依据（模块级常量求值期即会用到） */
function loadPacks(){
  PACKS = Object.create(null);
  try{
    const raw = JSON.parse(localStorage.getItem(PACK_KEY) || '{}');
    if(!raw || typeof raw !== 'object' || Array.isArray(raw)) return;
    /* 只认结构正确的包，且只保留字符串译文（顺带过滤掉被写坏的条目） */
    for(const id of Object.keys(raw)){
      const v = raw[id];
      if(!v || typeof v !== 'object' || typeof v.n !== 'string') continue;
      if(!v.m || typeof v.m !== 'object' || Array.isArray(v.m)) continue;
      const m = Object.create(null);
      for(const k of Object.keys(v.m)) if(typeof v.m[k] === 'string') m[k] = v.m[k];
      PACKS[id] = { n: v.n, m: m, font: typeof v.font === 'string' ? v.font : null };
    }
  }catch(e){ PACKS = Object.create(null); }
}
function savePacks(){
  try{ localStorage.setItem(PACK_KEY, JSON.stringify(PACKS)); }catch(e){}
}
function langList(){
  const out = [];
  for(const id in I18N) out.push({ id, n:I18N[id].n, pack:false });
  for(const id in PACKS) out.push({ id, n:PACKS[id].n || id, pack:true });

/* 静态 DOM 翻译：WeakMap 记住原文，切回中文可无损还原 */
const _trText = new WeakMap(), _trAttr = new WeakMap();
function translateStaticDOM(){
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if(!p || p.tagName === 'SCRIPT' || p.tagName === 'STYLE') return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){
    /* 以 WeakMap 中记录的原文为准：这样 en→ja 二次切换也能拿到原文；
       且只处理内容确实是「简体原文」的节点，已译节点会被跳过，保证幂等。 */
    const recorded = _trText.get(n);
    const orig = recorded === undefined ? n.nodeValue : recorded;
    const key = orig.trim();
    if(!isSourceKey(key)) continue;
    if(recorded === undefined) _trText.set(n, orig);
    const at = orig.indexOf(key);
    const lead = orig.slice(0, at), tail = orig.slice(at + key.length);
    n.nodeValue = lead + tr(key) + tail;
  }
  document.querySelectorAll('[title],[placeholder],[aria-label]').forEach(el => {
    let m = _trAttr.get(el);
    if(!m){ m = {}; _trAttr.set(el, m); }
    for(const a of ['title', 'placeholder', 'aria-label']){
      if(!el.hasAttribute(a)) continue;
      if(m[a] === undefined) m[a] = el.getAttribute(a);
      const k = m[a].trim();
      el.setAttribute(a, isSourceKey(k) ? tr(k) : m[a]);
    }
  });
}

function installPack(obj){
  if(!obj || typeof obj !== 'object') throw new Error(tr('语言包格式不正确：需包含 name 与 dict 字段'));
  const name = (typeof obj.name === 'string') ? obj.name.trim() : '';
  if(!name || !obj.dict || typeof obj.dict !== 'object' || Array.isArray(obj.dict))
    throw new Error(tr('语言包格式不正确：需包含 name 与 dict 字段'));
  /* id 会作为对象键：限制字符集，且不允许覆盖内置语言（否则界面语言会被劫持） */
  const id = (typeof obj.id === 'string' && obj.id.trim()) ? obj.id.trim() : ('pack:' + name);
  if(!/^[A-Za-z0-9_-]{1,40}$/.test(id) || I18N[id])
    throw new Error(tr('语言包 id 无效（只能用字母数字下划线与连字符，且不能与内置语言重名）'));
  /* 只收字符串译文，并限制条目数与单条长度，避免塞爆 localStorage */
  const m = Object.create(null);
  let cnt = 0;
  for(const k of Object.keys(obj.dict)){
    const v = obj.dict[k];
    if(typeof v !== 'string' || !v) continue;
    if(++cnt > 5000) break;
    m[k] = v.slice(0, 2000);
  }
  PACKS[id] = { n: name.slice(0, 40), m: m, font: typeof obj.font === 'string' ? obj.font : null };
  savePacks();
  return id;
}

/* ---------------- 工具函数 ---------------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtNum(n){ return n >= 10000 ? (n/1000).toFixed(1).replace(/\.0$/,'')+'k' : String(n); }
function fmtFull(n){ return (n||0).toLocaleString('zh-CN'); }
function fmtBytes(b){
  if(b == null) return '—';
  if(b < 1024) return b + ' B';
  if(b < 1048576) return (b/1024).toFixed(b < 10240 ? 1 : 0) + ' KB';
  if(b < 1073741824) return (b/1048576).toFixed(b < 10485760 ? 2 : 1) + ' MB';
  return (b/1073741824).toFixed(2) + ' GB';
}
function pct(a,b){ return b > 0 ? a/b*100 : 0; }
function fmtPct(v){ return (v < 10 ? v.toFixed(1) : v.toFixed(0)) + '%'; }
function extOf(name){
  const b = name.toLowerCase();
  if(b === 'dockerfile') return 'dockerfile';
  if(b === 'makefile') return 'makefile';
  if(b.startsWith('.')) return b.slice(1);
  const i = b.lastIndexOf('.');
  return i > 0 ? b.slice(i+1) : '';
}
function langOf(name){ const e = extOf(name); return LANGS[e] || OTHER_LANG; }
function relLum(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b)/255;
}
function textOn(hex){ return relLum(hex) > 0.62 ? 'rgba(0,0,0,.84)' : 'rgba(255,255,255,.96)'; }
function shade(hex, k){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return '#' + [r*k, g*k, b*k].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function tint(hex, k){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return '#' + [r,g,b].map(v => Math.round(v + (255 - v) * k).toString(16).padStart(2,'0')).join('');
}
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function toast(msg){

  clearTimeout(toast._t); toast._t = setTimeout(() => elToast.classList.remove('on'), 2400);
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------------- 聚合 ---------------- */
function aggregate(node){
  const a = { lines:0, size:0, files:0, bytes:0, code:0, blank:0, comment:0 };
  const langs = new Map();
  const add = (k, v) => {
    let e = langs.get(k);
    if(!e){ e = { lines:0, size:0, files:0 }; langs.set(k, e); }
    e.lines += v.lines; e.size += v.size; e.files += v.files;
  };
  for(const c of node.children){
    const ca = c.agg;
    a.lines += ca.lines; a.size += ca.size; a.files += ca.files; a.bytes += ca.bytes;
    a.code += ca.code; a.blank += ca.blank; a.comment += ca.comment;
    for(const [k,v] of c._langs) add(k, v);
  }
  node._langs = langs;
  /* 目录代表色：代码目录按行数，纯资源目录按体积 */
  const useLines = a.lines > 0;
  let best = 'other', bestV = -1;
  for(const [k,v] of langs){
    const s = useLines ? v.lines : v.size;
    if(s > bestV){ bestV = s; best = k; }
  }
  node.domLang = best;
  node.agg = a;
  return a;
}
function langStat(map, by){
  const out = [];
  for(const [k,v] of map) out.push({ key:k, lines:v.lines, size:v.size, files:v.files });
  const key = by || S.metric;
  out.sort((x,y) => (y[key] || 0) - (x[key] || 0));
  return out;
}
function metricOf(n){
  return S.metric === 'lines' ? n.agg.lines : S.metric === 'size' ? n.agg.size : n.agg.files;
}
function metricWord(){ return S.metric === 'size' ? tr('体积') : S.metric === 'files' ? tr('文件数') : tr('代码行'); }
function metricText(n){
  return S.metric === 'size' ? fmtBytes(n.agg.size)
       : S.metric === 'files' ? n.agg.files + tr(' 个')
       : fmtNum(n.agg.lines);
}
function isDir(n){ return n.kind === 'dir'; }

/* ---------------- 扫描：File System Access API ---------------- */
async function fileNode(file, path, getFile){
  const name = file.name, ext = extOf(name);
  const n = {
    kind:'file', name, path, ext, size:file.size, mtime:file.lastModified,
    lines:0, code:0, blank:0, comment:0, big:false, getFile, _txt:null,
    pk: previewKind(ext)
  };
  const isText = TEXT_EXT.has(ext) || (file.type && file.type.startsWith('text/'));
  if(isText && file.size <= prefBytes()){
    try{
      const txt = await file.text();
      const arr = txt.split(/\r\n|\r|\n/);
      let total = arr.length;
      if(total > 1 && arr[total-1] === '') total--;
      const hashLike = HASH_COMMENT.has(ext);
      let blank = 0, comment = 0;
      for(let i=0; i<total; i++){
        const t = arr[i].trim();
        if(!t){ blank++; continue; }
        if(t.startsWith('//') || t.startsWith('/*') || t.startsWith('*') || t.startsWith('<!--') ||
           t.startsWith('--') || (hashLike && t.startsWith('#'))) comment++;
      }
      n.lines = total; n.blank = blank; n.comment = comment;
      n.code = Math.max(0, total - blank - comment);
      if(file.size < 320 * 1024) n._txt = txt;
    }catch(e){ n.big = true; }
  }else{
    n.big = true;
  }
  return n;
}
const HASH_COMMENT = new Set(['py','sh','bash','zsh','yml','yaml','toml','ini','conf','r','pl','rb','ps1',
  'properties','gitignore','editorconfig','env','cfg','mk','cmake','makefile']);

async function scanDir(handle, path, counter, ignore){
  const node = { kind:'dir', name:handle.name, path, children:[] };
  const files = [], dirs = [];
  /* 逐个 next() 而非 for await：个别条目读取失败（系统保护目录、被独占的文件）时
     跳过即可，不至于让整个目录的扫描中断。 */
  const it = handle.values();
  while(true){
    let step;
    try{ step = await it.next(); }
    catch(e){ break; }
    if(step.done) break;
    const entry = step.value;
    if(entry.kind === 'directory'){
      if(ignore && isIgnoredDir(entry.name)) continue;
      dirs.push(entry);
    }else{
      if(ignore && IGNORE_FILES.has(entry.name)) continue;
      files.push(entry);
    }
  }
  const CONC = 24;
  let i = 0;
  const runners = Array.from({ length: Math.min(CONC, files.length) }, async () => {
    while(true){
      const k = i++;
      if(k >= files.length) return;
      const fh = files[k];
      const rel = path ? path + '/' + fh.name : fh.name;
      try{
        const f = await fh.getFile();
        node.children.push(await fileNode(f, rel, async () => await fh.getFile()));
        counter.count++;
        if(counter.count % 15 === 0) counter.tick(counter.count);
      }catch(e){ /* 读取失败则跳过 */ }
    }
  });
  await Promise.all(runners);
  for(const d of dirs){
    counter.tick(counter.count, d.name);
    node.children.push(await scanDir(d, path ? path + '/' + d.name : d.name, counter, ignore));
  }
  return node;
}

/* ---------------- 扫描：拖拽降级通道 ---------------- */
function readAllEntries(reader){
  return new Promise((res, rej) => {
    const out = [];
    const step = () => reader.readEntries(batch => {
      if(!batch.length) return res(out);
      out.push(...batch); step();
    }, rej);
    step();
  });
}
async function entryToNode(entry, path, counter, ignore){
  if(entry.isFile){
    const f = await new Promise((res, rej) => entry.file(res, rej));
    counter.count++;
    if(counter.count % 15 === 0) counter.tick(counter.count);
    return fileNode(f, path, () => new Promise((res, rej) => entry.file(res, rej)));
  }
  const node = { kind:'dir', name:entry.name, path, children:[] };
  const entries = await readAllEntries(entry.createReader());
  const subs = [];
  for(const e of entries){
    if(e.isDirectory){
      if(ignore && IGNORE_DIRS.has(e.name)) continue;
      subs.push(e);
    }else{
      if(ignore && IGNORE_FILES.has(e.name)) continue;
      const rel = path ? path + '/' + e.name : e.name;
      try{ node.children.push(await entryToNode(e, rel, counter, ignore)); }catch(err){}
    }
  }
  for(const d of subs){
    counter.tick(counter.count, d.name);
    node.children.push(await entryToNode(d, path ? path + '/' + d.name : d.name, counter, ignore));
  }
  return node;
}

/* ---------------- squarified treemap（Bruls et al. 2000） ---------------- */
function worstRatio(areas, total, side){
  let mx = -Infinity, mn = Infinity;
  for(const a of areas){ if(a > mx) mx = a; if(a < mn) mn = a; }
  const s2 = side * side, t2 = total * total;
  return Math.max(s2 * mx / t2, t2 / (s2 * mn));
}
function squarify(items, x, y, w, h){
  const out = [];
  if(!items.length || w <= 0 || h <= 0) return out;
  let total = 0;
  for(const it of items) total += it.value;
  if(total <= 0) return out;
  const scale = (w * h) / total;
  const queue = items.map(d => ({ d, area: d.value * scale }));
  let rx = x, ry = y, rw = w, rh = h, i = 0;
  while(i < queue.length){
    if(rw <= 0.01 || rh <= 0.01) break;
    const side = Math.min(rw, rh);
    const row = [queue[i]];
    let rowArea = queue[i].area;
    let best = worstRatio([rowArea], rowArea, side);
    let j = i + 1;
    while(j < queue.length){
      const na = rowArea + queue[j].area;
      const areas = row.map(r => r.area); areas.push(queue[j].area);
      const cand = worstRatio(areas, na, side);
      if(cand > best) break;
      row.push(queue[j]); rowArea = na; best = cand; j++;
    }
    const thick = side > 0 ? rowArea / side : 0;
    if(rw >= rh){
      let oy = ry;
      for(const r of row){
        const hh = rowArea > 0 ? (r.area / rowArea) * rh : 0;
        out.push({ node:r.d.node, x:rx, y:oy, w:thick, h:hh });
        oy += hh;
      }
      rx += thick; rw -= thick;
    }else{
      let ox = rx;
      for(const r of row){
        const ww = rowArea > 0 ? (r.area / rowArea) * rw : 0;
        out.push({ node:r.d.node, x:ox, y:ry, w:ww, h:thick });
        ox += ww;
      }
      ry += thick; rh -= thick;
    }
    i = j;
  }
  return out;
}

/* ---------------- 当前层可见子项 ---------------- */
/* 递归匹配时**必须**先确认节点还有子级：文件节点的 children 是 undefined，
   直接 for...of 会抛 "node.children is not iterable"，导致搜索一到没有
   直接命中的层级就把地图打崩（表现为「搜索框用不了」）。 */
function hasMatch(node, q){
  if(node._mq === q) return node._mv;
  let v = node.name.toLowerCase().includes(q);
  if(!v && node.children){
    for(const c of node.children){ if(hasMatch(c, q)){ v = true; break; } }
  }
  node._mq = q; node._mv = v;
  return v;
}
/* ================= 搜索内核：对齐 voidtools Everything 的查询语义 =================
   照搬的底层逻辑：
     · 索引：把已载入的整棵树扁平化成一张表（对应 Everything 的 USN 索引），
       搜索**不受当前层限制**；每次输入都在这张表上重算，结果随输入单调收敛。
     · 默认匹配「文件名」子串，大小写不敏感；* 与 ? 为通配符。
     · 空格 = AND，| = OR，! 或 - = NOT，"" 可包住含空格的短语。
     · 操作符：ext: path: parent: file: folder: case: regex: wfn:
       size: dm: startwith: endwith: wholeword:
================================================================================ */
const SEARCH_OPS = {
  ext:1, path:1, parent:1, file:1, folder:1, dir:1, case:1, regex:1, wfn:1,
  size:1, dm:1, startwith:1, endwith:1, wholeword:1
};
let IDX = null;              /* 扁平索引 */
let IDX_ROOT = null;         /* 建索引时的根节点，换项目/重扫后自动重建 */
const SEARCH_CACHE = new Map();

function buildIndex(){
  IDX = [];
  SEARCH_CACHE.clear();
  if(!S.root) return;
  const stack = [S.root];
  while(stack.length){
    const n = stack.pop();
    n._ln  = (n.name || '').toLowerCase();
    n._lp  = (n.path || '').toLowerCase();
    n._sz  = isDir(n) ? ((n.agg && n.agg.size) || 0) : (n.size || 0);
    const i = (n.path || '').lastIndexOf('/');
    n._par = i < 0 ? '' : n.path.slice(0, i);
    n._parl = n._par.toLowerCase();
    IDX.push(n);
    if(n.children){ for(let k = n.children.length - 1; k >= 0; k--) stack.push(n.children[k]); }
  }
}
function ensureIndex(){
  if(!IDX || IDX_ROOT !== S.root){ IDX_ROOT = S.root; buildIndex(); }
}

/* 去掉首尾引号、识别通配符 */
function wildcardRe(val, cs){
  const esc = val.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.');
  return new RegExp('^' + esc + '$', cs ? '' : 'i');
}
function nameHit(n, val, cs){
  if(val.indexOf('*') >= 0 || val.indexOf('?') >= 0) return wildcardRe(val, cs).test(n.name);
  const s = cs ? n.name : n._ln;
  return s.indexOf(cs ? val : val.toLowerCase()) >= 0;
}
function parseSize(s){
  const m = /^\s*([\d.]+)\s*(b|kb|mb|gb|tb)?\s*$/i.exec(s);
  if(!m) return null;
  const u = (m[2] || 'b').toLowerCase();
  const k = { b:1, kb:1024, mb:1048576, gb:1073741824, tb:1099511627776 }[u];
  return parseFloat(m[1]) * k;
}
function sizeTest(val, get){
  let s = val.trim(), m;
  if(!/^[<>=]/.test(s) && (m = /^(.+?)(?:\.\.|-)(.+)$/.exec(s))){
    const a = parseSize(m[1]), b = parseSize(m[2]);
    if(a !== null && b !== null) return n => { const v = get(n); return v >= a && v <= b; };
  }
  if((m = /^(>=|<=|>|<)(.+)$/.exec(s))){
    const t = parseSize(m[2]);
    if(t === null) return null;
    if(m[1] === '>')  return n => get(n) >  t;
    if(m[1] === '>=') return n => get(n) >= t;
    if(m[1] === '<')  return n => get(n) <  t;
    return n => get(n) <= t;
  }
  const t = parseSize(s);
  return t === null ? null : (n => get(n) === t);
}
function dmTest(val){
  const DAY = 86400000;
  const z = new Date(); z.setHours(0, 0, 0, 0);
  const named = {
    today:     [z.getTime(), z.getTime() + DAY],
    yesterday: [z.getTime() - DAY, z.getTime()],
    thisweek:  [z.getTime() - z.getDay() * DAY, z.getTime() + DAY],
    thismonth: [new Date(z.getFullYear(), z.getMonth(), 1).getTime(), z.getTime() + DAY],
    thisyear:  [new Date(z.getFullYear(), 0, 1).getTime(), z.getTime() + DAY]
  };
  const s = val.trim().toLowerCase();
  let m;
  if(named[s]){ const a = named[s][0], b = named[s][1]; return n => n.mtime >= a && n.mtime < b; }
  const P = x => { const t = Date.parse(x); return isNaN(t) ? null : t; };
  if(!/^[<>=]/.test(s) && (m = /^(.+?)(?:\.\.|-)(.+)$/.exec(s))){
    const a = P(m[1]), b = P(m[2]);
    if(a !== null && b !== null) return n => n.mtime >= a && n.mtime <= b + DAY;
  }
  if((m = /^(>=|<=|>|<)(.+)$/.exec(s))){
    const t = P(m[2]);
    if(t === null) return null;
    if(m[1] === '>')  return n => n.mtime >  t;
    if(m[1] === '>=') return n => n.mtime >= t;
    if(m[1] === '<')  return n => n.mtime <  t;
    return n => n.mtime <= t;
  }
  const t = P(s);
  return t === null ? null : (n => n.mtime >= t && n.mtime < t + DAY);
}
function makeTerm(op, val, neg, cs){
  let test;
  if(op === 'ext'){
    const list = val.toLowerCase().split(/[;,]/).map(x => x.replace(/^\*?\.?/, '')).filter(Boolean);
    test = n => list.indexOf((n.ext || '').toLowerCase()) >= 0;
  }else if(op === 'path'){
    test = n => (cs ? (n.path || '') : n._lp).indexOf(cs ? val : val.toLowerCase()) >= 0;
  }else if(op === 'parent'){
    test = n => (cs ? n._par : n._parl).indexOf(cs ? val : val.toLowerCase()) >= 0;
  }else if(op === 'file'){
    test = val ? (n => !isDir(n) && nameHit(n, val, cs)) : (n => !isDir(n));
  }else if(op === 'folder' || op === 'dir'){
    test = val ? (n => isDir(n) && nameHit(n, val, cs)) : (n => isDir(n));
  }else if(op === 'regex'){
    let re = null;
    try{ re = new RegExp(val, cs ? '' : 'i'); }catch(e){ re = null; }
    test = re ? (n => re.test(n.name)) : (() => false);
  }else if(op === 'wfn'){
    const re = wildcardRe(val, cs);
    test = n => re.test(n.name);
  }else if(op === 'startwith'){
    test = n => (cs ? n.name : n._ln).indexOf(cs ? val : val.toLowerCase()) === 0;
  }else if(op === 'endwith'){
    const v = cs ? val : val.toLowerCase();
    test = n => { const s = cs ? n.name : n._ln; return s.length >= v.length && s.slice(s.length - v.length) === v; };
  }else if(op === 'wholeword'){
    const re = new RegExp('(^|[^\\w])' + val.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^\\w]|$)', cs ? '' : 'i');
    test = n => re.test(n.name);
  }else if(op === 'size'){
    test = sizeTest(val, n => n._sz) || (() => false);
  }else if(op === 'dm'){
    test = dmTest(val) || (() => false);
  }else{
    test = n => nameHit(n, val, cs);
  }
  if(neg){ const t = test; test = n => !t(n); }
  return test;
}
function tokenizeQuery(q){
  const out = [];
  let i = 0;
  while(i < q.length){
    const c = q[i];
    if(c === ' ' || c === '\t'){ i++; continue; }
    if(c === '|'){ out.push('|'); i++; continue; }
    let s = '';
    if(c === '"'){
      i++;
      while(i < q.length && q[i] !== '"') s += q[i++];
      i++;
    }else{
      while(i < q.length && !/\s/.test(q[i]) && q[i] !== '|') s += q[i++];
    }
    if(s) out.push(s);
  }
  return out;
}
function compileQuery(q){
  const toks = tokenizeQuery(q);
  let cs = false;
  for(const t of toks){
    const m = /^!*-?([a-z]+):/i.exec(t);
    if(m && m[1].toLowerCase() === 'case') cs = true;
  }
  const groups = [[]];
  for(const t of toks){
    if(t === '|'){ groups.push([]); continue; }
    let s = t, neg = false, guard = 0;
    while(s && (s[0] === '!' || s[0] === '-') && guard++ < 8){ neg = !neg; s = s.slice(1); }
    if(!s) continue;
    let op = null, val = s;
    const m = /^([a-z]+):(.*)$/i.exec(s);
    if(m && SEARCH_OPS[m[1].toLowerCase()]){ op = m[1].toLowerCase(); val = m[2]; }
    /* case: 既可以是独立开关（case: foo），也可以直接贴着词写（case:README）——
       后者原先会被整条丢弃，导致「加 case: 反而搜不到」。 */
    if(op === 'case'){
      if(val) groups[groups.length - 1].push(makeTerm(null, val, neg, true));
      continue;
    }
    groups[groups.length - 1].push(makeTerm(op, val, neg, cs));
  }
  return groups.filter(g => g.length);
}
/* 查询文本 -> 命中节点数组（null 表示未在搜索） */
function runSearch(q){
  if(SEARCH_CACHE.has(q)) return SEARCH_CACHE.get(q);
  ensureIndex();
  const groups = compileQuery(q);
  const out = [];
  if(groups.length){
    for(const n of IDX){
      for(const g of groups){
        let all = true;
        for(const t of g){ if(!t(n)){ all = false; break; } }
        if(all){ out.push(n); break; }
      }
    }
  }
  if(SEARCH_CACHE.size > 32) SEARCH_CACHE.clear();
  SEARCH_CACHE.set(q, out);
  return out;
}
function searchNodes(){
  if(!S.query || !S.query.trim()) return null;
  return runSearch(S.query);
}

function visibleChildren(){
  const cwd = S.cwd || S.root;
  if(!cwd) return [];
  let kids = cwd.children.slice();
  const q = S.query.trim().toLowerCase();
  if(q){
    kids = kids.filter(n => isDir(n) ? hasMatch(n, q) : n.name.toLowerCase().includes(q));
  }
  return kids;
}

/* ---------------- 视图：Treemap ---------------- */
function renderMap(){
  try{ renderMapInner(); }
  catch(err){
    console.error(tr('CodeMap 绘制地图失败：'), err);
    elMap.innerHTML = '';
    drawNotice(tr('绘制地图时出错：') + err.message);
  }
}
function renderMapInner(){
  elMap.innerHTML = '';
  if(!S.root){ elEmpty.style.display = 'flex'; return; }
  elEmpty.style.display = 'none';
  if(S.view !== 'map') return;

  const box = elWrap.getBoundingClientRect();
  const W = Math.max(160, Math.floor(box.width)), H = Math.max(120, Math.floor(box.height));
  elMap.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  elMap.setAttribute('preserveAspectRatio', 'none');

  const items = capItems(visibleItems());
  if(!items.length){
    if(S.query){
      /* 地图只画文件；若命中项全是文件夹（如 folder: 查询），别误报「没有匹配」 */
      const r = searchNodes();
      drawNotice(r && r.length ? tr('匹配项均为文件夹，请切换到列表视图查看') : tr('没有匹配的内容'));
    }else{
      drawNotice(tr('这个目录是空的'));
    }
    return;
  }

  const ns = 'http://www.w3.org/2000/svg';
  const frag = document.createDocumentFragment();
  paintLevel(squarify(items, 2.5, 2.5, Math.max(1, W - 5), Math.max(1, H - 5)), 0, frag, ns);
  elMap.appendChild(frag);
}

function visibleItems(){
  const res = searchNodes();
  /* 搜索态：结果集是**整棵树的扁平命中**（Everything 语义）；
     目录是聚合体，画出来会与其中的文件重复计面积，故地图只画命中文件。 */
  const src = res ? res.filter(n => !isDir(n)) : visibleChildren();
  const arr = src.map(n => ({ node:n, value: Math.max(1, metricOf(n)) }));
  arr.sort((a,b) => b.value - a.value);
  return arr;
}
function capItems(items){
  const CAP = prefNum('mapCap');          /* 0 = 不限（偏好） */
  if(!CAP || items.length <= CAP) return items;
  const tail = items.slice(CAP - 1);
  const sum = tail.reduce((s,t) => s + t.value, 0);
  const head = items.slice(0, CAP - 1);
  head.push({
    node:{ kind:'virtual', name:tr('其他 ') + tail.length + tr(' 项'), path:'',
           agg:{ lines:0, size:0, files:0, bytes:0, code:0, blank:0, comment:0 } },
    value: sum
  });
  return head;
}
/* 同色相逐层淡化：底色越浅，文字越深，层次靠明度区分而非边框 */
function layerFill(base, depth, virt){
  if(virt) return S.isDark ? '#3a4048' : '#c9ced5';
  const k = LAYER_TINT[Math.min(depth, LAYER_TINT.length - 1)];
  return S.isDark ? shade(base, 1 - k * 0.72) : tint(base, k);
}
function lum(hex){
  const n = parseInt(hex.slice(1), 16);
  return (0.2126*((n>>16)&255) + 0.7152*((n>>8)&255) + 0.0722*(n&255)) / 255;
}
function layerText(fill, virt){
  if(virt) return lum(fill) < .55 ? '#ffffff' : '#3a4048';
  return lum(fill) < .55 ? '#ffffff' : '#111111';
}

function paintLevel(rects, depth, frag, ns){
  const gap  = LAYER_GAP[Math.min(depth, LAYER_GAP.length - 1)];
  const need = LAYER_AREA[Math.min(depth, LAYER_AREA.length - 1)];

  for(const r of rects){
    const n    = r.node;
    const virt = n.kind === 'virtual';
    const dir  = n.kind === 'dir';
    const base = virt ? '#9AA0A6' : langColor(dir ? n.domLang : n.ext);
    const fill = layerFill(base, depth, virt);
    const tc   = layerText(fill, virt);

    const x = r.x + gap / 2, y = r.y + gap / 2;
    const w = Math.max(.6, r.w - gap), h = Math.max(.6, r.h - gap);

    /* 单链目录（只含一个子目录）向下穿透，避免逐层空白吃掉面积 */
    let inner = n;
    if(dir){
      let guard = 0;
      while(inner.children && inner.children.length === 1
            && inner.children[0].kind === 'dir' && guard++ < 12){
        inner = inner.children[0];
      }
    }
    /* 是否值得继续向内展开 */
    const kids = dir ? inner.children : null;
    const nest = !!kids && kids.length >= 2 && depth < prefNum('depth')
              && r.w * r.h >= need && w > 46 && h > 34;

    /* 1) 底块先入，保证位于下层 */
    const g = document.createElementNS(ns, 'g');
    if(!virt) g.setAttribute('data-path', n.path);
    const rect = document.createElementNS(ns, 'rect');
    rect.setAttribute('class', 'blk');
    rect.setAttribute('x', x.toFixed(1)); rect.setAttribute('y', y.toFixed(1));
    rect.setAttribute('width', w.toFixed(1)); rect.setAttribute('height', h.toFixed(1));
    rect.setAttribute('rx', depth === 0 ? '3' : '2');
    rect.setAttribute('fill', fill);
    /* 选中态交给 CSS，让它跟随强调色 */
    if(S.selected && !virt && S.selected.path === n.path) rect.setAttribute('class', 'blk sel');
    g.appendChild(rect);
    frag.appendChild(g);

    /* 2) 子层递归，叠在底块之上 */
    if(nest){
      const px = 4, pt = LABEL_H, pb = 4;
      const iw = w - px * 2, ih = h - pt - pb;
      if(iw > 8 && ih > 8){
        const sub = capItems(kids.map(k => ({ node:k, value: Math.max(1, metricOf(k)) }))
          .sort((a,b) => b.value - a.value));
        paintLevel(squarify(sub, x + px, y + pt, iw, ih), depth + 1, frag, ns);
      }
    }

    /* 3) 标签最后入，始终压在最上层 */
    if(!virt && w > 42 && h > 17){
      const fs = Math.min(12, Math.max(10.5, Math.min(w / 9, h / 3)));
      const charW = (ch, size) => (ch.charCodeAt(0) > 255 ? 1 : 0.62) * size;
      /* 容器块右侧要放汇总值（如 13.38 GB）：先量出它的实际宽度，
         文件名的截断预算相应收窄，两者之间留 12px 间隙——
         否则长文件名会一路排到右缘，与右对齐的度量文字重叠。 */
      const showRight = nest && w > 120;
      const mfs = Math.max(9.5, fs - 2);
      const mv  = showRight ? metricText(n) : '';
      let mw = 0;
      for(let i = 0; i < mv.length; i++) mw += charW(mv[i], mfs);
      const lim = Math.max(16, w - 10 - (showRight ? mw + 12 : 0));
      let label = n.name, accW = 0, cutAt = label.length;
      for(let i = 0; i < label.length; i++){
        accW += charW(label[i], fs);
        if(accW > lim){ cutAt = i; break; }
      }
      if(cutAt < label.length) label = label.slice(0, Math.max(1, cutAt - 1)) + '…';
      const t = document.createElementNS(ns, 'text');
      t.setAttribute('x', (x + 5).toFixed(1));
      t.setAttribute('y', (y + fs * .98).toFixed(1));
      t.setAttribute('font-size', fs.toFixed(1));
      t.setAttribute('font-weight', '400');
      t.setAttribute('fill', tc);
      t.textContent = label;
      frag.appendChild(t);

      /* 容器块把汇总值靠右放，避免和内部子块抢空间（showRight 已预留宽度） */
      if(showRight){
          const v = document.createElementNS(ns, 'text');
          v.setAttribute('x', (x + w - 5).toFixed(1));
          v.setAttribute('y', (y + fs * .98).toFixed(1));
          v.setAttribute('text-anchor', 'end');
          v.setAttribute('font-size', Math.max(9.5, fs - 2).toFixed(1));
          v.setAttribute('fill', tc);
          v.setAttribute('opacity', '.7');
          v.textContent = metricText(n);
          frag.appendChild(v);
      }else if(h > 40 && w > 84){
        const sub = document.createElementNS(ns, 'text');
        sub.setAttribute('x', (x + 5).toFixed(1));
        sub.setAttribute('y', (y + fs * 2 + 3).toFixed(1));
        sub.setAttribute('font-size', Math.max(9, fs - 2.5).toFixed(1));
        sub.setAttribute('fill', tc);
        sub.setAttribute('opacity', '.72');
        sub.textContent = metricText(n);
        frag.appendChild(sub);
      }
    }
  }
}
function drawNotice(text){
  const ns = 'http://www.w3.org/2000/svg';
  const t = document.createElementNS(ns, 'text');
  t.setAttribute('x', '50%'); t.setAttribute('y', '50%');
  t.setAttribute('text-anchor', 'middle');
  t.setAttribute('fill', 'currentColor');
  t.setAttribute('opacity', '.45');
  t.setAttribute('font-size', '13');
  t.textContent = text;
  elMap.appendChild(t);
}

/* ---------------- 视图：列表 ---------------- */
function renderList(){
  if(!S.root || S.view !== 'list'){ elTbl.style.display = 'none'; return; }
  elEmpty.style.display = 'none';
  elTbl.style.display = 'block';

  const res = searchNodes();
  const searching = !!res;
  const kids = (res || visibleChildren()).slice();
  const dir = S.sortDir;
  kids.sort((a,b) => {
    /* 目录恒定优先，同级再按列排序；搜索态是扁平结果，不强制目录在前 */
    if(!searching && isDir(a) !== isDir(b)) return isDir(a) ? -1 : 1;
    const k = S.sortKey;
    let va, vb;
    if(k === 'name'){ va = a.name.toLowerCase(); vb = b.name.toLowerCase();
      return va < vb ? -dir : va > vb ? dir : 0; }
    if(k === 'type'){ va = isDir(a) ? '' : langName(a.ext); vb = isDir(b) ? '' : langName(b.ext);
      return va < vb ? -dir : va > vb ? dir : 0; }
    if(k === 'code'){ va = pct(a.agg.code, a.agg.lines || 1); vb = pct(b.agg.code, b.agg.lines || 1); }
    else if(k === 'size'){ va = a.agg.size; vb = b.agg.size; }
    else if(k === 'files'){ va = a.agg.files; vb = b.agg.files; }
    else if(k === 'mtime'){ va = a.mtime || 0; vb = b.mtime || 0; }
    else { va = a.agg.lines; vb = b.agg.lines; }
    return (va - vb) * dir;
  });

  /* 搜索态加一列「路径」——与 Everything 的「名称 / 路径 / 大小 / 修改时间」一致 */
  const cols = searching
    ? [['name',tr('名称')],['path',tr('路径')],['type',tr('类型')],['lines',tr('代码行')],
       ['code',tr('注释率')],['size',tr('体积')],['mtime',tr('修改时间')]]
    : [['name',tr('名称')],['type',tr('类型')],['lines',tr('代码行')],['code',tr('注释率')],
       ['size',tr('体积')],['files',tr('文件数')],['mtime',tr('修改时间')]];
  let html = '<table><thead><tr>';
  for(const [k,label] of cols){
    html += '<th data-k="' + k + '">' + label + (S.sortKey === k ? (S.sortDir < 0 ? ' ↓' : ' ↑') : '') + '</th>';
  }
  html += '</tr></thead><tbody>';
  const LIST_CAP = prefNum('listCap') || 1e9;   /* 0 = 不限 */
  const shown = kids.length > LIST_CAP ? kids.slice(0, LIST_CAP) : kids;
  for(const n of shown){
    const dn = isDir(n);
    const c = dn ? shade(langColor(n.domLang), S.isDark ? .7 : .95) : langColor(n.ext);
    const rate = n.agg.lines > 0 ? pct(n.agg.comment, n.agg.lines) : 0;
    html += '<tr data-path="' + esc(n.path) + '"' + (S.selected && S.selected.path === n.path ? ' class="on"' : '') + '>'
      + '<td><div class="nmcell"><span class="sw" style="background:' + c + '"></span>'
      + '<span class="tx">' + esc(n.name) + (dn ? '/' : '') + '</span></div></td>'
      + (searching ? '<td class="pth" title="' + esc(n.path) + '">' + esc(n.path) + '</td>' : '')
      + '<td style="color:var(--text-3)">' + (dn ? tr('目录') : langName(n.ext)) + '</td>'
      + '<td class="num">' + fmtFull(dn ? n.agg.lines : n.lines) + '</td>'
      + '<td class="num">' + (rate > 0 ? fmtPct(rate) : '—') + '</td>'
      + '<td class="num">' + fmtBytes(n.agg.size) + '</td>'
      + '<td class="num">' + n.agg.files + '</td>'
      + '<td class="num">' + (n.mtime ? new Date(n.mtime).toLocaleDateString('zh-CN') : '—') + '</td>'
      + '</tr>';
  }
  html += '</tbody></table>';
  if(kids.length > LIST_CAP)
    html += '<div class="cap-note">' + tr('仅显示前 {n} 项，共 {m} 项', { n: fmtFull(LIST_CAP), m: fmtFull(kids.length) }) + '</div>';
  if(!kids.length) html = '<div style="padding:44px;text-align:center;color:var(--text-3)">' + tr('没有匹配的内容') + '</div>';
  elTbl.innerHTML = html;
  elTbl.querySelectorAll('thead th').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if(S.sortKey === k) S.sortDir *= -1;
    else { S.sortKey = k; S.sortDir = (k === 'name' || k === 'type') ? 1 : -1; }
    renderList();
  });
}

/* ---------------- 侧栏：统计 ---------------- */
function renderStats(){
  if(!S.root){ elStats.innerHTML = '<div style="color:var(--text-3);font-size:12px">' + tr('尚未载入项目') + '</div>'; return; }
  const a = S.root.agg;
  const m = S.metric;
  const langs = langStat(S.root._langs, m);
  const totalL = a[m] || 1;

/* ---------------- 代码预览与轻量高亮 ---------------- */
const KEYWORDS = ('abstract|as|assert|async|await|boolean|break|byte|case|catch|char|class|const|constructor|'
  + 'continue|debugger|def|default|defer|delete|do|double|elif|else|enum|except|export|extends|extern|false|'
  + 'final|finally|float|fn|for|from|func|function|goto|if|impl|implements|import|in|instanceof|int|interface|'
  + 'internal|is|lambda|let|long|match|module|mut|namespace|native|null|new|nil|not|operator|or|override|'
  + 'package|partial|pass|private|protected|public|raise|readonly|record|ref|return|self|short|sizeof|static|'
  + 'struct|super|switch|synchronized|then|this|throw|throws|trait|transient|true|try|type|typeof|typedef|'
  + 'union|unsigned|use|using|var|virtual|void|volatile|when|where|while|with|yield|and|end|begin|select|'
  + 'insert|update|create|table|join|group|order|limit|offset|primary|key|foreign|references|index|values|'
  + 'set|into|distinct|count|sum|avg').split('|');

const RE_CACHE = new Map();
function buildRe(hashLike){
  const key = hashLike ? 'h' : 'n';
  if(RE_CACHE.has(key)) return RE_CACHE.get(key);
  const kw = KEYWORDS.join('|');
  const hash = hashLike ? '|(?:^[ \\t]*|[ \\t])#[^\\n]*' : '';
  const comment = '(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*|&lt;!--[\\s\\S]*?--&gt;' + hash + ')';
  const str = '("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\'|`(?:[^`\\\\]|\\\\.)*`)';
  const re = new RegExp(comment + '|' + str + '|(\\b(?:' + kw + ')\\b)|(\\b\\d+\\.?\\d*\\b)', 'gm');
  RE_CACHE.set(key, re);
  return re;
}
function highlight(line, ext){
  if(!line) return '';
  const re = buildRe(HASH_COMMENT.has(ext));
  re.lastIndex = 0;
  return esc(line).replace(re, (m, c, s, k, num) => {
    if(c !== undefined) return '<span class="tk-c">' + m + '</span>';
    if(s !== undefined) return '<span class="tk-s">' + m + '</span>';
    if(k !== undefined) return '<span class="tk-k">' + m + '</span>';
    if(num !== undefined) return '<span class="tk-n">' + m + '</span>';
    return m;
  });
}

   预览器：按文件类型分派
   text→高亮行号 · image→直出 · video/audio→原生播放器 · pdf→内嵌

async function getBlob(node, limit){
  if(!node.getFile) return null;

}

/* ---------- ZIP 容器 ---------- */
function unzipEntries(buf){
  const dv = new DataView(buf), n = buf.byteLength;
  let eocd = -1;
  for(let i = n - 22; i >= Math.max(0, n - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error(tr('不是有效的 ZIP 容器'));
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const list = [];
  for(let i = 0; i < count && off + 46 <= n; i++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize  = dv.getUint32(off + 20, true);
    const usize  = dv.getUint32(off + 24, true);
    const nlen   = dv.getUint16(off + 28, true);
    const elen   = dv.getUint16(off + 30, true);
    const clen   = dv.getUint16(off + 32, true);
    const lho    = dv.getUint32(off + 42, true);
    const name   = new TextDecoder('utf-8').decode(buf.slice(off + 46, off + 46 + nlen));
    list.push({ name, method, csize, usize, lho });
    off += 46 + nlen + elen + clen;
  }
  return list;
}
async function unzipRead(buf, e){
  const dv = new DataView(buf);
  if(dv.getUint32(e.lho, true) !== 0x04034b50) throw new Error(tr('条目头损坏'));
  const nlen = dv.getUint16(e.lho + 26, true);
  const elen = dv.getUint16(e.lho + 28, true);
  const start = e.lho + 30 + nlen + elen;
  const data = buf.slice(start, start + e.csize);
  if(e.method === 0) return data;
  if(e.method !== 8) throw new Error(tr('不支持的压缩方式'));
  if(typeof DecompressionStream === 'undefined') throw new Error(tr('当前浏览器不支持解压'));
  const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(stream).arrayBuffer();
}
function xmlDecode(s){
  return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")
          .replace(/&#x([0-9a-fA-F]+);/g, (m,h) => String.fromCodePoint(parseInt(h,16)))
          .replace(/&#(\d+);/g, (m,d) => String.fromCodePoint(+d))
          .replace(/&amp;/g,'&');
}
/* 从 OOXML / ODF 容器中抽取可见文本 */
async function ooxmlText(buf, ext){
  const entries = unzipEntries(buf);
  const dec = ab => new TextDecoder('utf-8').decode(ab);
  const read = async name => {
    const e = entries.find(x => x.name === name);
    return e ? dec(await unzipRead(buf, e)) : '';
  };
  const out = [];
  if(ext === 'docx' || ext === 'odt'){
    const xml = await read(ext === 'docx' ? 'word/document.xml' : 'content.xml');
    if(!xml) throw new Error(tr('容器里找不到正文部件'));
    if(ext === 'docx'){
      for(const p of xml.split(/<w:p[ >]/).slice(1)){
        out.push([...p.matchAll(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)].map(m => xmlDecode(m[1])).join(''));
      }
    }else{
      out.push(...[...xml.matchAll(/<text:p[^>]*>([\s\S]*?)<\/text:p>/g)]
        .map(m => xmlDecode(m[1].replace(/<[^>]+>/g, ''))));
    }
  }else if(ext === 'pptx' || ext === 'odp'){
    const slides = entries.filter(e => /slides\/slide\d+\.xml$/.test(e.name) ||
                                       /content\.xml$/.test(e.name))
      .sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric:true }));
    let i = 0;
    for(const s of slides){
      const xml = dec(await unzipRead(buf, s));
      const texts = [...xml.matchAll(/<a:t[^>]*>([\s\S]*?)<\/a:t>/g)].map(m => xmlDecode(m[1]))
        .concat([...xml.matchAll(/<text:p[^>]*>([\s\S]*?)<\/text:p>/g)]
          .map(m => xmlDecode(m[1].replace(/<[^>]+>/g, ''))));
      if(texts.length){ i++; out.push(tr('—— 第 ') + i + tr(' 页 ——')); out.push(...texts); }
    }
  }else if(ext === 'xlsx' || ext === 'xlsm' || ext === 'ods'){
    const shared = await read('xl/sharedStrings.xml');
    const pool = [...shared.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(m => xmlDecode(m[1]));
    const sheets = entries.filter(e => /^xl\/worksheets\/sheet\d+\.xml$/.test(e.name))
      .sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric:true }));
    for(const s of sheets){
      const xml = dec(await unzipRead(buf, s));
      out.push('—— ' + s.name.split('/').pop().replace('.xml','') + ' ——');
      for(const row of xml.split(/<row[ >]/).slice(1)){
        const vals = [...row.matchAll(/<c\b([^>]*)>([\s\S]*?)<\/c>/g)].map(c => {
          const attrs = c[1], inner = c[2];
          if(/\bt="inlineStr"/.test(attrs)){
            const m = /<t[^>]*>([\s\S]*?)<\/t>/.exec(inner);
            return m ? xmlDecode(m[1]) : '';
          }
          const v = /<v[^>]*>([\s\S]*?)<\/v>/.exec(inner);
          if(!v) return '';
          return /\bt="s"/.test(attrs) ? (pool[+v[1]] || '') : xmlDecode(v[1]);
        });
        if(vals.some(v => v !== '')) out.push(vals.join('\t'));
      }
    }
  }
  if(!String(out.join('')).trim()) throw new Error(tr('文档里没有提取到可见文本'));
  return out.join('\n');
}

/* ---------- 十六进制 ---------- */
function hexDump(ab){
  const bytes = new Uint8Array(ab);
  const lines = [];
  for(let i = 0; i < bytes.length; i += 16){
    const chunk = bytes.subarray(i, i + 16);
    const hex = [...chunk].map(b => b.toString(16).padStart(2,'0')).join(' ').padEnd(47, ' ');
    const asc = [...chunk].map(b => (b >= 32 && b < 127) ? String.fromCharCode(b) : '.').join('');
    lines.push(i.toString(16).padStart(8,'0') + '  ' + hex + ' |' + asc + '|');
  }
  return lines.join('\n') || tr('(空文件)');
}

/* ---------- 表格 ---------- */
function csvParse(text, sep){
  const rows = [];
  let row = [], cell = '', q = false;
  for(let i = 0; i < text.length && rows.length <= 420; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    }else if(c === '"') q = true;
    else if(c === sep){ row.push(cell); cell = ''; }
    else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if(c !== '\r') cell += c;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function csvTable(text, sep){
  const rows = csvParse(text, sep);
  if(!rows.length) return '<div class="pv-mono">' + tr('(空文件)') + '</div>';
  const head = rows[0], body = rows.slice(1, 400);
  return '<table class="pv-tbl"><thead><tr>'
    + head.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>'
    + body.map(r => '<tr>' + head.map((_,i) => '<td>' + esc(r[i] || '') + '</td>').join('') + '</tr>').join('')
    + '</tbody></table>'
    + (rows.length > 401 ? '<div class="pv-bar">' + tr('仅显示前 400 行') + '</div>' : '');
}

async function pvBinary(node, host, alive){
  if(!node.getFile) return pvNoSource(host);
  const HEXMAX = prefNum('hexKB') * 1024;    /* 偏好：2/8/32 KB */
  const b = await getBlob(node, HEXMAX);
  const ab = await b.arrayBuffer();
  if(!alive()) return;
  host.dataset.mode = 'text';
  /* 只有实际被截断时才说「显示前 N（共 M）」，否则只报体积，避免「768 B 的文件显示前 2.0 KB」这种误导 */
  const capped = node.size > HEXMAX;
  host.innerHTML = '<div class="pv-bar">'
    + (capped
        ? tr('十六进制视图 · 显示前 ') + fmtBytes(HEXMAX) + tr('（共 ') + fmtBytes(node.size) + '）'
        : tr('十六进制视图') + ' · ' + fmtBytes(node.size))
    + '<span class="spacer"></span>'
    + '<span>' + tr('这类文件不按文本解析') + '</span>' + '</div>' + '<pre class="pv-mono">' + esc(hexDump(ab)) + '</pre>';
}
/* 预览压缩包里的单个条目：文本按高亮显示，其它走十六进制；可返回清单 */
async function openZipEntry(node, host, alive, buf, list, i){
  const e = list[i];
  if(!e) return;
  const MAXENTRY = 8 * 1024 * 1024;
  const head = (extra) => '<div class="pv-bar">' + esc(e.name)
    + '<span class="spacer"></span>' + (extra || '') + '</div>';

  if(e.usize > MAXENTRY){
    host.dataset.mode = 'note';
    host.innerHTML = head() + '<div style="padding:14px;font-size:12px;color:var(--text-3)">'
      + tr('条目过大，未展开预览（') + fmtBytes(e.usize) + '）</div>';
    return;
  }
  let data = null, err = null;
  try{ data = await unzipRead(buf, e); }catch(ex){ err = ex; }
  if(!alive()) return;

  const back = '<button class="btn ghost" id="zipBack" style="height:22px;padding:0 8px;font-size:11.5px">'
    + tr('返回清单') + '</button>';
  host.dataset.mode = 'text';
  if(err){
    host.innerHTML = head(back) + '<div style="padding:14px;font-size:12px;color:var(--text-3)">'
      + esc(err.message || String(err)) + '</div>';
  }else{
    const ext = (e.name.split('.').pop() || '').toLowerCase();
    const isText = TEXT_EXT.has(ext);
    host.innerHTML = head(back) + (isText
      ? textBlock(new TextDecoder('utf-8').decode(data), ext, false)
      : '<pre class="pv-mono">' + esc(hexDump(data)) + '</pre>');
  }
  const b = $('zipBack');
  if(b) b.onclick = () => { if(alive()) pvZip(node, host, alive); };
}
async function pvZip(node, host, alive){
  const buf = await getBuf(node, BIN_LIMIT);
  if(!alive()) return;
  if(!buf) return pvNoSource(host);
  let list;
  try{ list = unzipEntries(buf); }catch(e){ return pvBinary(node, host, alive); }
  host.dataset.mode = 'text';
  host.innerHTML = '<div class="pv-bar">' + tr('压缩包内含 ') + fmtFull(list.length) + tr(' 个条目')
    + '<span class="spacer">' + '</span>' + '<span>' + tr('点条目可预览内容') + '</span>' + '</div>'
    + '<table class="pv-tbl pv-zip">' + '<thead>' + '<tr>' + '<th>' + tr('路径') + '</th>'
    + '<th>' + tr('原始大小（字节）') + '</th>' + '</tr></thead>' + '<tbody>'
    + list.map((e, i) => '<tr data-i="' + i + '" title="' + esc(e.name) + '">'
        + '<td>' + esc(e.name) + '</td><td>' + e.usize + '</td></tr>').join('')
    + '</tbody></table>';
  /* 点条目：解出该条目内容就地预览；文件过大或压缩方式不支持时给提示 */
  host.querySelectorAll('tr[data-i]').forEach(tr => {
    tr.onclick = () => openZipEntry(node, host, alive, buf, list, parseInt(tr.dataset.i, 10));
  });
}
async function pvSheet(node, host, alive){
