/* 结构化提取：返回块数组，用于把 docx 表格、xlsx 多工作表渲染成真正的表格，
   而不是一整段文本。odt/ods/odp 仍走纯文本兜底。 */
async function ooxmlBlocks(buf, ext){
  const entries = unzipEntries(buf);
  const dec = ab => new TextDecoder('utf-8').decode(ab);
  const read = async name => {
    const e = entries.find(x => x.name === name);
    return e ? dec(await unzipRead(buf, e)) : '';
  };
  const cellText = xml => [...xml.matchAll(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)]
    .map(m => xmlDecode(m[1])).join('');
  const blocks = [];

  if(ext === 'docx'){
    const xml = await read('word/document.xml');
    if(!xml) throw new Error(tr('容器里找不到正文部件'));
    const body = xml.slice(xml.indexOf('<w:body>'));
    /* 顺序扫描：表格整体成块，普通段落各自成块 */
    const re = /<w:tbl>([\s\S]*?)<\/w:tbl>|<w:p\b[^>]*>([\s\S]*?)<\/w:p>/g;
    let m;
    while((m = re.exec(body))){
      if(m[1] !== undefined){
        const rows = [...m[1].matchAll(/<w:tr\b[^>]*>([\s\S]*?)<\/w:tr>/g)].map(r =>
          [...r[1].matchAll(/<w:tc\b[^>]*>([\s\S]*?)<\/w:tc>/g)].map(c => cellText(c[1])));
        if(rows.length) blocks.push({ t:'table', rows });
      }else{
        const txt = cellText(m[2]);
        if(txt.trim()) blocks.push({ t:'p', s: txt });
      }
    }
  }else if(ext === 'xlsx' || ext === 'xlsm'){
    const shared = await read('xl/sharedStrings.xml');
    const pool = [...shared.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(m => xmlDecode(m[1]));
    const wb = await read('xl/workbook.xml');
    const names = [...wb.matchAll(/<sheet\b[^>]*\bname="([^"]*)"/g)].map(m => xmlDecode(m[1]));
    const sheets = entries.filter(e => /^xl\/worksheets\/sheet\d+\.xml$/.test(e.name))
      .sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric:true }));
    for(let si = 0; si < sheets.length; si++){
      const s = sheets[si];
      blocks.push({ t:'h', s: names[si] || s.name.split('/').pop().replace('.xml','') });
      const xml = dec(await unzipRead(buf, s));
      const rows = [];
      for(const row of xml.split(/<row[ >]/).slice(1)){
        const vals = [...row.matchAll(/<c\b([^>]*)>([\s\S]*?)<\/c>/g)].map(c => {
          const attrs = c[1], inner = c[2];
          if(/\bt="inlineStr"/.test(attrs)){
            const m = /<t[^>]*>([\s\S]*?)<\/t>/.exec(inner);
            return m ? xmlDecode(m[1]) : '';
          }
          const v = /<v[^>]*>([\s\S]*?)<\/v>/.exec(inner);
          if(!v) return '';
          return /\bt="s"/.test(attrs) ? (pool[+v[1]] || '') : xmlDecode(v[1]);
        });
        if(vals.some(v => v !== '')) rows.push(vals);
      }
      if(rows.length) blocks.push({ t:'table', rows });
    }
  }else if(ext === 'pptx'){
    const slides = entries.filter(e => /ppt\/slides\/slide\d+\.xml$/.test(e.name))
      .sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric:true }));
    for(let i = 0; i < slides.length; i++){
      const xml = dec(await unzipRead(buf, slides[i]));
      const texts = [...xml.matchAll(/<a:t[^>]*>([\s\S]*?)<\/a:t>/g)].map(m => xmlDecode(m[1]));
      if(!texts.length) continue;
      blocks.push({ t:'h', s: tr('第 ') + (i + 1) + tr(' 页') });
      texts.forEach(s => blocks.push({ t:'p', s }));
    }
  }
  if(!blocks.length) throw new Error(tr('文档里没有提取到可见文本'));
  return blocks;
}
/* 把块数组渲染成 HTML：段落 -> <p>，表格 -> 真正的 <table> */
function blocksToHtml(blocks){
  return blocks.map(b => {
    if(b.t === 'h') return '<div class="pv-h">' + esc(b.s) + '</div>';
    if(b.t === 'table'){
      const cols = b.rows.reduce((m, r) => Math.max(m, r.length), 0);
      return '<table class="pv-tbl"><tbody>' + b.rows.map(r => {
        let tr = '<tr>';
        for(let i = 0; i < cols; i++) tr += '<td>' + esc(r[i] === undefined ? '' : r[i]) + '</td>';
        return tr + '</tr>';
      }).join('') + '</tbody></table>';
    }
    return '<p class="pv-p">' + esc(b.s) + '</p>';
  }).join('');
}

async function pvOoxml(node, host, alive){
  const buf = await getBuf(node, BIN_LIMIT);
  if(!alive()) return;
  if(!buf) return pvNoSource(host);
  try{
    const ext = node.ext;
    const rich = (ext === 'docx' || ext === 'xlsx' || ext === 'xlsm' || ext === 'pptx');
    let bodyHtml;
    if(rich){
      const blocks = await ooxmlBlocks(buf, ext);
      if(!alive()) return;
      bodyHtml = blocksToHtml(blocks);
    }else{
      const txt = await ooxmlText(buf, ext);
      if(!alive()) return;
      bodyHtml = textBlock(txt, 'txt', false);
    }
    host.dataset.mode = 'text';
    host.innerHTML = '<div class="pv-bar">'
      + tr('已从文档 XML 中提取内容，样式与图片不在此显示')
      + '<span class="spacer"></span><span>' + esc(langName(node.ext)) + '</span></div>'
      + '<div class="pv-doc">' + bodyHtml + '</div>';
  }catch(e){
    if(!alive()) return;
    host.dataset.mode = 'note';
    host.innerHTML = pvNote(langName(node.ext), node.name, [
      tr('无法解析该文档正文：') + esc(e.message || String(e)),
      tr('文件大小 ') + fmtBytes(node.size) + tr('，可下载后用对应软件打开。')
    ]);
  }
}

/* ---------------- 查找与选中 ---------------- */
function findByPath(path){
  if(!S.root) return null;
  if(path === S.root.path) return S.root;
  const parts = path.split('/');
  let cur = S.root;
  for(const p of parts){
    if(!cur.children) return null;
    cur = cur.children.find(c => c.name === p);
    if(!cur) return null;
  }
  return cur;
}
function select(node){
  S.selected = node;
  /* 注意：这里**不**改 S.expanded —— 单击若改变布局，第二次点击就会落到别的块上，
     双击判定会失败。展开交给 goto()（双击进入时执行）。 */
  elRight.classList.remove('collapsed');
  if(S.view === 'map'){
    /* 地图上只切换选中态样式：整图重绘在数千格的目录里要 0.5–1s，
       而点击只影响"哪一格高亮"，没必要重画。树与详情仍需刷新。 */
    document.querySelectorAll('#map g[data-path]').forEach(g => {
      const rect = g.querySelector('rect.blk');
      if(rect) rect.classList.toggle('sel', !!node && g.getAttribute('data-path') === node.path);
    });
    renderTree(); renderInspector(); updateStatus();
  }else{
    renderAll();
  }
}

/* 剪贴板：navigator.clipboard 优先，失败退回 execCommand */
async function copyText(t){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(t);
      return true;
    }
  }catch(e){ }
  try{
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e2){ return false; }
}

/* 绝对路径只能问宿主（exe 弹一次原生目录框，结果写进 window.__hostRootAbs） */
function requestRootAbs(cb){
  if(S.rootAbs){ cb(S.rootAbs); return; }
  if(!(window.chrome && window.chrome.webview && window.chrome.webview.postMessage)){
    cb(null); return;
  }
  window.__hostRootAbs = undefined;
  window.chrome.webview.postMessage('CMD:pickRoot');
  let tries = 0;
  const timer = setInterval(() => {
    tries++;
    if(typeof window.__hostRootAbs !== 'undefined'){
      clearInterval(timer);
      S.rootAbs = window.__hostRootAbs || null;
      if(S.rootAbs){
        try{ localStorage.setItem('codemap.rootAbs.' + (S.rootName || ''), S.rootAbs); }catch(_){}
      }
      cb(S.rootAbs);
    } else if(tries > 1200){
      clearInterval(timer);
      cb(null);
    }
  }, 100);
}

  if(act === 'name'){

    return;

      const abs = rootAbs.replace(/[\\/]+$/, '') + '\\'

});

/* ---------------- 事件 ---------------- */

/* 统一的「单击选中 / 双击打开」判定。
   为什么不能直接用 dblclick：select() 会调用 renderAll() 重建整个 SVG DOM（还可能
   因 S.expanded 改变布局），第二次点击时目标元素已经换成了新的，浏览器就不会派发
   dblclick —— 双击因此完全失效。
   所以这里自己判定：同一目标 400ms 内被点两次即视为双击；单击则延后 220ms 执行，
   给双击留出判定窗口。 */
function bindClickOpen(host, sel, preHook){
  let last = { path:'', t:0, timer:null };
  host.addEventListener('click', e => {
    const el = e.target.closest(sel);
    if(!el) return;
    if(preHook && preHook(e, el)) return;      /* 前置钩子已消费该次点击 */
    const path = el.getAttribute('data-path');
    if(!path) return;
    const n = findByPath(path);
    if(!n) return;

    const now = performance.now();
    if(last.path === path && now - last.t < 400){
      /* 双击 → 目录进入 / 文件预览 */
      if(last.timer){ clearTimeout(last.timer); last.timer = null; }
      last = { path:'', t:0, timer:null };
      if(isDir(n)) goto(n); else openViewer(n);
      return;
    }
    last.path = path;
    last.t = now;
    if(last.timer) clearTimeout(last.timer);
    last.timer = setTimeout(() => {
      last.timer = null;
      select(n);
    }, 220);
  });
}

function softOf(hex){ return S.isDark ? shade(hex, .26) : tint(hex, .87); }
/* 偏好校验：localStorage 可能被旧版本或手工改坏，逐项回落到安全值。
   一条坏数据（如 accent 是数字）会让 shade() 抛错，进而让整段初始化中断、
   界面一片空白——所以所有偏好在使用前必须过这一关。 */
function sanitizePrefs(p){
  const o = { skin:'nothing', palette:null, accent:null, lang:'zh-CN', fonts:{} };
  if(!p || typeof p !== 'object') return o;
  if(typeof p.skin === 'string' && SKIN_DARK[p.skin] !== undefined) o.skin = p.skin;
  if(typeof p.palette === 'string' && Object.prototype.hasOwnProperty.call(PALETTES, p.palette))
    o.palette = p.palette;
  if(typeof p.accent === 'string' && /^#[0-9a-fA-F]{6}$/.test(p.accent)) o.accent = p.accent;
  if(typeof p.lang === 'string' && (I18N[p.lang] || PACKS[p.lang])) o.lang = p.lang;
  if(p.fonts && typeof p.fonts === 'object' && !Array.isArray(p.fonts)){
    for(const k in p.fonts){
      const v = p.fonts[k];
      if(typeof v === 'string') o.fonts[k] = v.replace(/[;\r\n<>]/g, ' ').trim().slice(0, 160);
    }
  }
  /* 可调参数：越界/非数字一律回落默认值 */
  for(const k of ['mapCap','depth','listCap','pvLines','pvMB','hexKB']){
    const n = parseFloat(p[k]);
    o[k] = isNaN(n) || n < 0 ? PREF_DEF[k] : n;
  }
  /* 自定义忽略目录：去空、去重、限长 */
  o.ignoreDirs = Array.isArray(p.ignoreDirs)
    ? Array.from(new Set(p.ignoreDirs.filter(x => typeof x === 'string')
        .map(x => x.trim().slice(0, 64)).filter(Boolean))).slice(0, 200)
    : [];
  return o;
}
function prefsSave(){
  try{

      skin:S.skin, palette:S.palette, accent:S.accent, lang:S.lang, fonts:S.fonts,
      mapCap:S.prefs.mapCap, depth:S.prefs.depth, listCap:S.prefs.listCap,
      pvLines:S.prefs.pvLines, pvMB:S.prefs.pvMB, hexKB:S.prefs.hexKB,
      ignoreDirs:S.prefs.ignoreDirs
    }));
  }catch(e){}
}
function applyAccent(color){
  /* 只接受 #rrggbb：深链参数与 localStorage 都可能带进非颜色值，
     否则 shade() 里的 hex.slice() 会抛错、连带整段初始化中断。 */
  const valid = typeof color === 'string' && /^#[0-9a-fA-F]{6}$/.test(color);
  S.accent = valid ? color : null;
  const st = document.documentElement.style;
  if(valid){
    st.setProperty('--accent', color);
    st.setProperty('--accent-soft', softOf(color));
  }else{
    st.removeProperty('--accent');
    st.removeProperty('--accent-soft');
  }
}
function applySkin(skin, palette, accent, quiet){
  S.skin = SKIN_DARK[skin] === undefined ? 'nothing' : skin;

  document.documentElement.setAttribute('data-skin', S.skin);

     与下面「色板」跟随 SKIN_PALETTE 的行为保持一致。

function exportPng(){
  if(!S.root || S.view !== 'map'){ toast(tr('请先切换到「地图」视图再导出')); return; }
  try{
    const svg = $('map');
    const clone = svg.cloneNode(true);
    const vb = (svg.getAttribute('viewBox') || '0 0 100 100').split(/\s+/).map(Number);
    const W = vb[2] || 800, H = vb[3] || 600;
    clone.setAttribute('width', W); clone.setAttribute('height', H);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('x', 0); bg.setAttribute('y', 0);
    bg.setAttribute('width', W); bg.setAttribute('height', H);
    bg.setAttribute('fill', S.isDark ? '#15121f' : '#ffffff');
    clone.insertBefore(bg, clone.firstChild);
    const xml = new XMLSerializer().serializeToString(clone);
    const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    const img = new Image();
    img.onload = () => {
      const scale = 2;
      const cv = document.createElement('canvas');
      cv.width = W * scale; cv.height = H * scale;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = S.isDark ? '#15121f' : '#ffffff';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => {
        if(!b){ toast(tr('导出失败')); return; }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = (S.rootName || 'codemap') + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1500);
        toast(tr('已导出 PNG：') + (S.rootName || 'codemap') + '.png');
      }, 'image/png');
    };
    img.onerror = () => toast(tr('导出失败：图片渲染错误'));
    img.src = url;
  }catch(err){ toast(tr('导出失败：') + err.message); }
}

document.querySelectorAll('#menus .menu').forEach(m => {

    e.stopPropagation();

    closePanels();
    document.querySelectorAll('#menus .menu.open').forEach(o => { if(o !== m) o.classList.remove('open'); });
    m.classList.toggle('open');
  });
  /* 成熟菜单栏的标配：已有菜单（或面板）展开时，划过其他菜单直接切换，无需再点。
     「外观 / 语言」是同一交互的面板形态，悬停时同样要弹出——否则划过它们毫无反应，
     与其余四项不一致。注意冷启动（什么都没开）时六项都不弹出，保持一致。 */
  label.addEventListener('mouseenter', () => {
    const menuMode = !!document.querySelector('#menus .menu.open')
                  || $('skinPanel').classList.contains('on') || $('langPanel').classList.contains('on');
    if(!menuMode) return;
    const which = m.dataset.menu;
    if(which === 'skin' || which === 'lang'){

      if(!panel.classList.contains('on')){

      m.classList.add('open');
    }
  });
});

/* 左右栏宽度都可拖拽；拖动过程中用 rAF 每帧同步重画地图，
   避免「旧 viewBox 被新容器尺寸非均匀拉伸 → 文字变扁/变窄」 */
(function initResizer(){
  function makeRz(rz, cfg){
    if(!rz) return;
    let dragging = false;
    const apply = w => {
      /* 联合约束：本侧最大 = 窗口宽 − 对侧面板当前宽（收起时为 0）− 地图保底 220px，
         防止两侧同时拖宽把地图挤没 */
      let cap = window.innerWidth - 220;
      if(cfg.other && cfg.other.offsetWidth > 0) cap -= cfg.other.offsetWidth;
      cap = Math.max(cfg.min, Math.min(cap, Math.round(window.innerWidth * cfg.maxFrac)));
      cfg.el.style.width = Math.max(cfg.min, Math.min(cap, w)) + 'px';
    };
    try{
      const w = parseInt(localStorage.getItem(cfg.key), 10);
      if(w) apply(w);
    }catch(e){}
    rz.addEventListener('mousedown', e => {
      dragging = true; rz.classList.add('on');
      document.body.style.cursor = 'col-resize'; e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if(!dragging) return;
      apply(cfg.calc(e));
      scheduleMap();
    });
    document.addEventListener('mouseup', () => {
      if(!dragging) return;
      dragging = false; rz.classList.remove('on');
      document.body.style.cursor = '';
      try{ localStorage.setItem(cfg.key, cfg.el.style.width); }catch(e){}
    });
  }
  makeRz($('rzLeft'),  { el: elLeft,  other: elRight, key: 'codemap.leftW',  min: 264, maxFrac: .5,  calc: e => e.clientX });
  makeRz($('rzRight'), { el: elRight, other: elLeft,  key: 'codemap.rightW', min: 280, maxFrac: .72, calc: e => window.innerWidth - e.clientX });
})();

/* ---------------- 扫描流程 ---------------- */
function startScan(){ elScan.classList.add('on'); setProgress(0, tr('准备中…')); }

function setProgress(p, txt){

/* 从缓存的 File 列表重建目录树（切换忽略规则 / 重新扫描时复用，无需再次选择目录）
   之所以不用 File System Access API：在 file:// 页面下 origin 是 opaque，
   目录授权无法持久化，遍历时会抛
   "An attempt was made to write to a file or directory which could not be modified
    due to the state of the underlying filesystem."
   而 <input type="file" webkitdirectory> 拿到的 File 对象不受 origin 限制。 */
async function rebuildFromFiles(){
  if(!S.fileList || !S.fileList.length){
    toast(tr('请先用「打开文件夹」载入一个目录')); return;
  }
  startScan();
  try{
    const t0 = performance.now();
    const root = { kind:'dir', name:S.rootName || tr('项目'), path:'', children:[] };
    const dirIndex = new Map([['', root]]);

    const ensureDir = (parts) => {
      let cur = root, key = '';
      for(const p of parts){
        key = key ? key + '/' + p : p;
        let d = dirIndex.get(key);
        if(!d){
          d = { kind:'dir', name:p, path:key, children:[] };
          dirIndex.set(key, d);
          cur.children.push(d);
        }
        cur = d;
      }
      return cur;
    };

    /* 1) 先搭目录骨架（同步，很快） */
    const queue = [];
    for(const f of S.fileList){
      const full = f.webkitRelativePath || f.name;
      const segs = full.split('/');
      const fileName = segs.pop();
      if(segs.length) segs.shift();                 /* 去掉根目录名（它已作为 root.name） */
      if(S.ignore){
        if(segs.some(p => IGNORE_DIRS.has(p))) continue;
        if(IGNORE_FILES.has(fileName)) continue;
      }
      const rel = segs.length ? segs.join('/') + '/' + fileName : fileName;
      queue.push({ f, rel, parent: ensureDir(segs) });
    }

    /* 2) 再逐个解析文件（并发 + 进度） */
    const CONC = 16;
    let idx = 0, done = 0;
    const runners = Array.from({ length: Math.min(CONC, queue.length) }, async () => {
      while(true){
        const k = idx++;
        if(k >= queue.length) return;
        const it = queue[k];
        try{
          const node = await fileNode(it.f, it.rel, async () => it.f);
          it.parent.children.push(node);
        }catch(e){ /* 单个文件失败不影响整体 */ }
        done++;
        if(done % 15 === 0) setProgress(done / queue.length, tr('已读取 ') + fmtFull(done) + tr(' 个文件'));
      }
    });
    await Promise.all(runners);

    root.path = '';
    S.root = root;
    finishLoad(root.name, ((performance.now() - t0) / 1000).toFixed(1));
  }catch(err){
    endScan();
    const tag = (err && err.name) ? err.name : 'Error';
    toast(tr('扫描失败：') + tag + ' — ' + ((err && err.message) ? err.message : String(err)));
    console.error(tr('[CodeMap] 扫描失败'), err);
  }
}

/* 「打开文件夹」用 <input type="file" webkitdirectory> 实现（定版单通道）。
   曾试验 showDirectoryPicker 双通道：本机 file:// origin 授权受限，
   实测失败回退且多弹一次权限气泡，已放弃。webkitdirectory 在 file:// 下
   不依赖 FSA 授权，稳定可用；代价是 Chromium 的目录上传确认气泡（平台 UI，无法定制）。 */
function openFolder(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.webkitdirectory = true;
  inp.multiple = true;
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = () => {
    const files = Array.from(inp.files || []);
    if(inp.parentNode) inp.parentNode.removeChild(inp);
    if(!files.length) return;
    S.fileList = files;
    const first = files[0].webkitRelativePath || files[0].name;
    S.rootName = first.split('/')[0] || tr('项目');
    try{ S.rootAbs = localStorage.getItem('codemap.rootAbs.' + S.rootName) || null; }
    catch(_){ S.rootAbs = null; }
    rebuildFromFiles();
  };
  inp.click();
}
$('btnOpen') && ($('btnOpen').onclick = openFolder);

function finishLoad(name, cost){
  endScan();
  if(!S.root){ toast(tr('没有读到内容')); return; }
  /* 后序遍历：绑定 parent 引用 + 计算聚合值 */
  (function link(node, parent){
    node.parent = parent;
    if(node.kind === 'file'){
      node.getFile = node.getFile || null;
      node.pk = node.pk || previewKind(node.ext);
      node._langs = new Map([[node.ext || 'other',
        { lines:node.lines || 0, size:node.size || 0, files:1 }]]);
      node.agg = { lines:node.lines || 0, size:node.size || 0, files:1, bytes:node.size || 0,
                   code:node.code || 0, blank:node.blank || 0, comment:node.comment || 0 };
      return;
    }
    for(const c of node.children) link(c, node);
    aggregate(node);
    /* 目录没有自己的修改时间：取子项中最新的一项。
       dm: 查询与列表「修改时间」列都依赖它，否则目录一律显示「—」。 */
    let mt = 0;
    for(const c of node.children){ if(c.mtime && c.mtime > mt) mt = c.mtime; }
    node.mtime = mt || node.mtime || 0;
  })(S.root, null);

  S.cwd = S.root; S.selected = null;
  S.expanded = new Set([S.root.path]);
  renderAll();
  const a = S.root.agg;
  toast(name + '：' + fmtFull(a.files) + tr(' 个文件 · ') + fmtFull(a.lines) + tr(' 行')
        + (cost ? tr(' · 用时 ') + cost + tr(' 秒') : ''));
  if(!a.files) toast(tr('这个目录里没有可统计的文本文件（试试关闭忽略规则）'));
  updateStatus();
}

/* ---------------- 空态与启动 ---------------- */
function buildEmptyState(){
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.setAttribute('class', 'art');
  /* Nothing 风格：点阵方框环绕 + 点阵化的 treemap 格。
     纯黑/白/灰承载结构，唯一红色块是视觉锚点（对应品牌里的红色指示点）。
     刻意不用多色分类——黑白灰的克制才是这套语言的核心。

     【间距必须同源】外圈 9×9 个位置、步距恒为 10，形成一条等差数列：
       位置 = 8, 18, 28, ..., 88   （9 个）
     这样「同排相邻点」「左排到中心」「右排到中心」的间距全部等于 10，
     四条边到中心的距离也一致，不会出现某一侧挤、某一侧松的观感。
     边长 C 取 4 而非 3：需满足 8*step + C + 2*margin = 100，
     步距 10 时只有 C 为偶数才能让起点落在整数像素上（C=4→margin=8；
     C=3 会得到 margin=8.5 的半像素，渲染时点会发糊）。 */
  const DOT_C = 4, DOT_MARGIN = 8, DOT_STEP = 10;
  const dotPos = i => DOT_MARGIN + i * DOT_STEP;   /* i = 0..8 → 8..88 */
  for(let i = 0; i < 9; i++){
    for(let j = 0; j < 9; j++){
      if(!(i === 0 || i === 8 || j === 0 || j === 8)) continue;  /* 只画外圈 */
      if(i === 8 && j === 0) continue;   /* 右上角留给红色指示点 */
      const d = document.createElementNS(ns, 'rect');
      d.setAttribute('x', dotPos(i)); d.setAttribute('y', dotPos(j));
      d.setAttribute('width', DOT_C); d.setAttribute('height', DOT_C);
      d.setAttribute('fill', '#111111'); d.setAttribute('opacity', '.88');
      svg.appendChild(d);
    }
  }
  /* 右上角一枚红点：呼应 Nothing 的红色录音指示，打破点阵的绝对对称 */
  const rd = document.createElementNS(ns, 'rect');
  rd.setAttribute('x', dotPos(8)); rd.setAttribute('y', dotPos(0));
  rd.setAttribute('width', DOT_C); rd.setAttribute('height', DOT_C);
  rd.setAttribute('fill', '#e63225');
  svg.appendChild(rd);

  /* 底板：极浅灰，让地图格有落脚处。
     点阵内沿在 12（= dotPos(0)+DOT_C = 8+4），底板外沿取 18，
     留 6 的呼吸间隙；底板 18..82 中心正好 50。 */
  const base = document.createElementNS(ns, 'rect');
  base.setAttribute('x', '18'); base.setAttribute('y', '18');
  base.setAttribute('width', '64'); base.setAttribute('height', '64');
  base.setAttribute('fill', '#f4f4f6');
  svg.appendChild(base);

  /* 3×3 点阵地图：黑=主模块，浅灰=散件，红=焦点（唯一点缀色）。
     格心 30 / 50 / 70，格心距 20（= 点阵步距 10 的 2 倍，同族）；外沿 21..79。 */
  const C = 18, G = 2, O = 50 - (C * 3 + G * 2) / 2;   /* O = 21 */  const GRID = [
    [0,0,'#111111'],[1,0,'#111111'],[2,0,'#c9c9cf'],
    [0,1,'#111111'],[1,1,'#e63225'],[2,1,'#c9c9cf'],
    [0,2,'#c9c9cf'],[1,2,'#c9c9cf'],[2,2,'#c9c9cf']
  ];
  for(const [c,r,fill] of GRID){
    const g = document.createElementNS(ns, 'rect');
    g.setAttribute('x', O + c * (C + G));
    g.setAttribute('y', O + r * (C + G));
    g.setAttribute('width', C); g.setAttribute('height', C);
    g.setAttribute('fill', fill);
    svg.appendChild(g);
  }
  const h2 = document.createElement('h2');
  h2.textContent = tr('把文件夹变成一张可下钻的地图');
  const p = document.createElement('p');
  p.textContent = tr('打开任意代码目录，按代码量、体积或文件数渲染成可下钻的矩形地图：面积越大体量越大，颜色代表语言。单击看详情，双击进入目录。');
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = tr('被分析的代码全程留在本机，不上传任何内容');
  const ob = document.createElement('button');
  ob.className = 'btn primary';
  ob.textContent = tr('打开文件夹');
  ob.style.marginTop = '16px';
  ob.onclick = openFolder;
  elEmpty.innerHTML = '';
  elEmpty.append(svg, h2, p, hint, ob);
}

/* ---------------- 示例项目（?demo=1） ---------------- */
/* 不依赖本机文件：构造一棵静态目录树走 finishLoad，让打开即可看到完整效果，
   也方便截图与演示。数据规模接近真实小项目。 */
function loadDemo(){
  const mk = (name, ext, lines, size) => ({ kind:'file', name, ext, lines, size });
  const d  = (name, children) => ({ kind:'dir', name, children });
  S.rootName = 'demo-project';
  S.root = d('demo-project', [
    d('src', [
      d('js',   [ mk('app.js','js',420,12000), mk('util.js','js',260,7400), mk('api.js','js',380,10500),
                  mk('store.js','js',190,5600), mk('router.js','js',230,6800), mk('hooks.js','js',150,4100) ]),
      d('css',  [ mk('main.css','css',520,15000), mk('theme.css','css',180,5200), mk('layout.css','css',310,8800) ]),
      d('py',   [ mk('server.py','py',640,21000), mk('model.py','py',420,13500), mk('db.py','py',280,8100) ]),
      mk('index.html','html',310,8900)
    ]),
    d('tests', [ mk('test_app.py','py',210,6300), mk('test_model.py','py',160,4700) ]),
    d('docs',  [ mk('README.md','md',120,3400), mk('CHANGELOG.md','md',60,1900) ]),
    mk('package.json','json',45,1200),
    mk('vite.config.js','js',88,2600)
  ]);
  /* fileList 保持为空：忽略规则/重新载入在示例上只弹提示，不会用假列表重建树 */
  S.fileList = null;
  finishLoad('demo-project');
}

(function init(){
  /* 深链参数：?demo=1 示例项目 · &view=list · &metric=size · &skin=cyber
     · &palette=neon · &accent=%23f59e0b · &path=子目录 */
  const qs = new URLSearchParams(location.search);
  let prefs = null;
  try{ prefs = JSON.parse(localStorage.getItem('codemap.prefs') || 'null'); }catch(e){}

  /* 语言 / 字体 / 语言包：先于渲染接线，保证首屏即为所选语言 */
  loadPacks();
  prefs = sanitizePrefs(prefs);      /* 语言包已载入，此时才能校验 lang */
  S.prefs = prefs;                      /* 可调参数的唯一来源 */
  USER_IGNORE = new Set(prefs.ignoreDirs || []);
  S.lang  = qs.get('lang') || prefs.lang || 'zh-CN';
  if(!I18N[S.lang] && !PACKS[S.lang]) S.lang = 'zh-CN';
  S.fonts = (prefs && prefs.fonts) || {};
  document.documentElement.setAttribute('lang', S.lang === 'zh-TW' ? 'zh-Hant' : S.lang);
  applyFonts();

  buildPanel();
  buildLangList();
  buildFontList();
  buildEmptyState();
  translateStaticDOM();
  applySkin(qs.get('skin') || (prefs && prefs.skin) || 'nothing',
            qs.get('palette') || (prefs && prefs.palette),
            qs.get('accent') || (prefs && prefs.accent), true);
  if(!('webkitdirectory' in document.createElement('input'))){
    elEmpty.querySelector('p').textContent = tr('把代码文件夹直接拖到这里即可渲染成矩形地图：面积越大体量越大，颜色代表语言。单击看详情，双击进入目录。');
  }
  new ResizeObserver(() => scheduleMap()).observe(elWrap);

  const v = qs.get('view');
  if(v === 'list' || v === 'map') S.view = v;
  const mt = qs.get('metric');
  if(mt === 'lines' || mt === 'size' || mt === 'files') S.metric = mt;
  renderAll();
  updateStatus();
  /* 示例项目：?demo=1 —— 不选文件夹直接看效果 */
  if(qs.get('demo') === '1') loadDemo();
  /* 深链到某个子目录：?path=backend/src/main/java */
  const pth = qs.get('path');
  if(pth && S.root){
    const t = findByPath(pth);
    if(t && isDir(t)){ S.cwd = t; S.expanded.add(t.path); S.selected = null; renderAll(); }
  }
  /* 深链打开文件预览：?file=WeatherService.java（支持文件名片段匹配） */
  const fq = qs.get('file');
  if(fq && S.root){
    let t = findByPath(fq);
    if(!t || t.kind !== 'file'){
      const q = fq.toLowerCase();
      (function walk(n){
        if(t) return;
        if(n.kind === 'file'){ if(n.name.toLowerCase().includes(q)) t = n; return; }
        for(const c of n.children){ walk(c); if(t) return; }
      })(S.root);
    }
    if(t && t.kind === 'file'){ select(t); if(!qs.has('noopen')) openViewer(t); }
  }
  if(qs.has('panel')) $('skinPanel').classList.add('on');
  syncMenuOpen();   /* 深链直接开面板时，同步菜单高亮 */
  /* 首次启动（无语言偏好记录）→ 弹语言选择；?nofirst=1 可跳过（供自动化测试） */
  if(!(prefs && prefs.lang) && !qs.has('nofirst')) setTimeout(showFirstRun, 220);
})();

/* ---------------- 偏好面板 ----------------
   这里只放"原先写死、用户没法改"的少数参数，刻意保持单页、无分类导航：
   入口在菜单「视图 → 偏好…」，改动立即生效并写入 codemap.prefs。 */
const PREF_UI = [
  ['mapCap',  '每层格子上限', '超出的格子聚合成「其他 N 项」；设为不限时超大目录会明显变慢',
   [[900,'900'],[2000,'2000'],[5000,'5000'],[0,'不限']]],
  ['depth',   '嵌套展开深度', '',
   [[2,'2'],[3,'3'],[4,'4'],[6,'6']]],
  ['listCap', '列表渲染上限', '搜索结果超过该行数时只渲染前面部分',
   [[3000,'3000'],[10000,'10000'],[0,'不限']]],
  ['pvLines', '文本预览行数', '',
   [[700,'700'],[2000,'2000'],[0,'不限']]],
  ['pvMB',    '文本预览体积上限', '超过该体积的文件不逐行统计',
   [[2.5,'2.5 MB'],[8,'8 MB'],[0,'不限']]],
  ['hexKB',   '十六进制显示上限', '',
   [[2,'2 KB'],[8,'8 KB'],[32,'32 KB']]]
];
function prefCur(k){
  const v = (S.prefs && S.prefs[k] !== undefined) ? S.prefs[k] : PREF_DEF[k];
  return String(v);
}
function renderPrefs(){
  const box = $('prefBody');
  if(!box) return;
  let html = PREF_UI.map(function(row){
    const k = row[0], t = row[1], d = row[2], opts = row[3];
    const cur = prefCur(k);
    return '<div class="pref-row" data-k="' + k + '">'
      + '<div class="t">' + esc(tr(t)) + '</div>'
      + (d ? '<div class="d">' + esc(tr(d)) + '</div>' : '')
      + '<div class="seg">' + opts.map(function(o){
          return '<button type="button" data-v="' + o[0] + '"'
            + (cur === String(o[0]) ? ' class="on"' : '') + '>' + esc(o[1]) + '</button>';
        }).join('') + '</div></div>';
  }).join('');
  html += '<div class="pref-row" data-k="ignoreDirs">'
    + '<div class="t">' + esc(tr('自定义忽略目录')) + '</div>'
    + '<div class="d">' + esc(tr('每行一个目录名，与内置清单合并生效；修改后会重新扫描')) + '</div>'
     + '<textarea id="prefIgnore" spellcheck="false">' 
    + esc(((S.prefs && S.prefs.ignoreDirs) || []).join('\n')) + '</textarea></div>';
  box.innerHTML = html;

  box.querySelectorAll('.seg button').forEach(function(b){
    b.onclick = function(){
      const row = b.closest('.pref-row');
      b.closest('.seg').querySelectorAll('button').forEach(function(x){
        x.classList.toggle('on', x === b);
      });
      applyPrefValue(row.dataset.k, b.dataset.v);
    };
  });
  const ta = $('prefIgnore');
  if(ta) ta.onchange = function(){
    const arr = Array.from(new Set(ta.value.split('\n')
      .map(function(x){ return x.trim(); }).filter(Boolean)));
    S.prefs.ignoreDirs = arr;
    USER_IGNORE = new Set(arr);
    prefsSave();
    if(S.fileList && S.fileList.length) rebuildFromFiles(); else renderAll();
    toast(tr('已更新忽略清单'));
  };
}
function applyPrefValue(k, v){
  const n = (String(v) === '0') ? 0 : parseFloat(v);
  S.prefs[k] = isNaN(n) ? PREF_DEF[k] : n;
  prefsSave();
  if(k === 'depth' || k === 'mapCap'){ if(typeof scheduleMap === 'function') scheduleMap(); else renderAll(); }
  else renderAll();
  toast(tr('已应用'));
}
function openPrefs(){ renderPrefs(); const m = $('prefModal'); if(m) m.classList.add('on'); }
function closePrefs(){ const m = $('prefModal'); if(m) m.classList.remove('on'); }
if($('prefClose')) $('prefClose').onclick = closePrefs;
if($('prefModal')) $('prefModal').addEventListener('click', function(e){
  if(e.target.id === 'prefModal') closePrefs();
});

/* 多实例：另一个窗口改了偏好 → 本窗口跟着同步，
   避免两边各自持有陈旧值、后保存的把对方改动覆盖掉。 */
window.addEventListener('storage', function(e){
  if(e.key !== 'codemap.prefs' || !e.newValue) return;
  try{
    const p = sanitizePrefs(JSON.parse(e.newValue));
    S.prefs = Object.assign({}, S.prefs, p);
    USER_IGNORE = new Set(p.ignoreDirs || []);
    applySkin(p.skin, p.palette, p.accent, true);
    S.fonts = p.fonts || {}; applyFonts();
    if(p.lang && p.lang !== LANG_ID) applyLang(p.lang);
    renderAll(); updateStatus();
  }catch(err){}
});
